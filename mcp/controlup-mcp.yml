- name: get-machine-statistics
  domain: vdi
  description: 'Returns historical performance metrics and resource consumption statistics for monitored machines, including
    servers and VDI desktops. **THIS IS THE PRIMARY TOOL FOR ANALYZING MACHINE/SERVER PERFORMANCE AND IDENTIFYING RESOURCE
    BOTTLENECKS.** Use this tool when users ask about: \''worst performing machines\'', \''machines with high CPU/memory/disk
    usage\'', \''machine performance issues\'', \''resource consumption\'', \''which machines are struggling\'', \''server
    performance problems\'', \''machines with session performance issues\'', \''session counts and metrics per machine\'',
    or any query about identifying poorly performing infrastructure. Returns metrics like CPU utilization, memory usage,
    disk I/O (reads/writes/transfers per second), network throughput, processor queue length, disk queue length, page faults,
    process counts, and session counts (total sessions, active sessions, user sessions, idle sessions, disconnected sessions,
    ICA sessions, session disconnect rate). Data can be grouped by individual machine, virtualization host, or organizational
    folder. Supports different aggregation types: Avg (average values over time period), Max (peak values), Min (minimum
    values), or Worst (automatically selects max/min based on what indicates poor performance for each metric - e.g., max
    for CPU usage, min for free disk space). When metricsType=\''UserSessions\'', returns session-related metrics per machine
    which is essential for VDI/DaaS session performance analysis. Essential for capacity planning, performance troubleshooting,
    identifying resource-starved machines, and finding infrastructure bottlenecks affecting user experience. Also supports
    GPU metrics (NVIDIA utilization, memory, encoder/decoder usage) and PVS metrics (Citrix Provisioning Services - boot
    times, cache usage, vDisk health) when metricsType parameter is set accordingly.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getMachineStatsByMachine
  rest: GET /v1/machines/statistics/{grouping}
- name: get-machine-sizing-virt
  domain: vdi
  description: 'Returns AI-powered sizing recommendations to optimize CPU, RAM, and disk resource allocation for virtual
    machines based on historical usage data from the previous month. Uses machine learning with an algorithm that analyzes
    the 95th percentile of usage values and adds a 15% buffer to provide optimal recommendations. Identifies over-provisioned
    machines (waste reduction), under-provisioned machines (performance improvement), and right-sized machines. Helps answer:
    What is the best allocation of CPU cores and RAM? Can resources be reallocated? Does a machine have sufficient resources
    for its workload? Recommendations categorize machines by sizing status (Over/Right/Under) for both CPU and memory. No
    input parameters required beyond pagination.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getRecommendationVirtualization
  rest: GET /v1/machines/sizing_recommendation/virtualization
- name: get-machine-sizing-recommendation-azure
  domain: vdi
  description: 'Returns comprehensive Azure cost optimization recommendations with specific Azure VM and disk SKU suggestions
    based on historical usage data. Uses AI/ML to analyze the previous month of data (95th percentile + 15% buffer) and
    recommends optimal Azure Virtual Machine sizes and managed disk configurations to reduce Azure compute costs. Provides
    detailed cost analysis across multiple pricing models (PAYG, Spot, Reserved 1Y/3Y) with percentage savings calculations.
    Helps answer: Which Azure VM sizing option best fits requirements? How much can be saved by right-sizing? What are the
    cost differences between pricing models? Requires Azure-specific configuration including licensing (Azure Hybrid Benefit
    vs OS Windows), region, currency, VM features (CPU architecture, networking, Hyper-V generation), disk options (tier,
    redundancy, size), and cost model preferences.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getRecommendationAzure
  rest: GET /v1/machines/sizing_recommendation/azure
- name: get-netscaler-metrics
  domain: vdi
  description: 'Returns aggregated performance metrics for NetScaler ADC (Application Delivery Controller) appliances to
    monitor health, identify bottlenecks, and analyze workload distribution. Provides average values for packet CPU utilization
    (percentage), memory usage (percentage), management CPU utilization, network traffic in/out (Mbps through all NICs),
    HDX session count, Load Balancer and Gateway availability percentages, High Availability status (primary/secondary),
    HA sync failures, and heartbeat rates. Use this to answer: Which NetScalers were available? Is workload evenly distributed?
    Are there performance bottlenecks? Track software version, build number, and configuration changes. Metrics are averaged
    over the specified time period (default: last 24 hours). This endpoint returns summary statistics without time-series
    granularity - use the V2 endpoint for time-series data.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getNetscalerUsage
  rest: GET /v1/netscaler/usage/system
- name: get-netscaler-load-balancer-metrics
  domain: vdi
  description: 'Returns aggregated performance and health metrics for NetScaler Load Balancer virtual servers distributing
    traffic across backend application servers. Monitors client connections, request/response traffic rates (Mbps), vServer
    health (percentage of bound services in Up state), active/inactive backend services, request hit rate (requests/sec),
    spillover events, surge queue depth, load-balancing method (Round Robin, Least Connection, etc.), and protocol (HTTP,
    SSL, etc.). Use this to answer: Do I need more capacity? How many requests does a load balancer handle during business
    hours? Is load balancer behavior affecting user experience? Track vServer IP address, port, active/inactive service
    counts, and identify performance bottlenecks. Returns summary statistics averaged over the time period (default: last
    24 hours) - use V2 endpoint for time-series trending with granular data points.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getLoadbalancerUsage
  rest: GET /v1/netscaler/usage/loadbalancer
- name: get-netscaler-gateway-metrics
  domain: vdi
  description: 'Returns aggregated performance metrics for NetScaler Gateway virtual servers providing secure remote access
    to Citrix Virtual Apps and Desktops. Monitors concurrent user connections, request/response traffic rates (Mbps), request/response
    rates (transactions/sec), Gateway IP address and port, and SSL/TLS certificate status (name and expiration date). Essential
    for remote access capacity planning and security management. Use this to answer: How many user connections does a gateway
    handle during business hours? When did gateways experience highest traffic? How does response rate compare to request
    rate? Are certificates expiring soon? Track user connection trends, bandwidth consumption patterns, and identify Gateway
    performance bottlenecks affecting remote user experience. Returns summary statistics averaged over the time period (default:
    last 24 hours) - use V2 endpoint for time-series trending with granular data points showing traffic patterns over time.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getGatewayUsageTimeSeries
  rest: GET /v2/netscaler/usage/gateway
- name: get-ns-metrics-timeseries-v2
  domain: vdi
  description: 'Returns performance metrics with time-series data for NetScaler ADC appliances, enabling trend analysis
    and historical performance visualization. Unlike the standard metrics endpoint which returns aggregated averages, this
    V2 endpoint provides granular data points over time for: Traffic In/Out (Mbps rate through NICs), Packet CPU utilization
    (%), Memory utilization (%), HDX session counts, and Management CPU utilization (%). Supports both summary view (single
    aggregated line for all appliances - percentages averaged, other metrics summed) and per-appliance view (individual
    trend lines for each appliance). Essential for identifying performance patterns, detecting configuration changes, spotting
    bottlenecks over time, and analyzing workload distribution trends across NetScaler infrastructure. Time-series granularity
    depends on the selected time range. Use this for dashboard visualizations, performance trending, and capacity planning.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getNetscalerUsageWithTimeSeries
  rest: GET /v2/netscaler/usage/system
- name: get-ns-lb-metrics-timeseries
  domain: vdi
  description: 'Returns performance metrics with time-series data for NetScaler Load Balancer virtual servers, enabling
    trend analysis and capacity planning. Unlike the standard endpoint which returns aggregated averages, this V2 endpoint
    provides granular data points over time for: client connections count, traffic in/out rates (request/response bits in
    Mbps), vServer health percentage (services in Up state), active/inactive services count, request hit rate, spillover
    events, and surge queue depth. Supports two visualization modes: Summary view (single aggregated line - percentages
    averaged, other metrics summed) and Per-Appliance view (individual trend lines for each Load Balancer). Essential for
    answering: When do peak loads occur during business hours? How did traffic patterns change after configuration updates?
    Are spillover events increasing? Is vServer health degrading over time? Click data points to view min/average/max values.
    Time-series granularity adapts to selected time range. Use this for capacity planning, performance dashboards, and identifying
    when load balancer changes impacted application delivery.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getLoadbalancerUsageWithTimeSeries
  rest: GET /v2/netscaler/usage/loadbalancer
- name: get-ns-gw-metrics-timeseries-v2
  domain: vdi
  description: 'Returns performance metrics with time-series data for NetScaler Gateway virtual servers, enabling trend
    analysis of remote access patterns and user activity over time. Unlike the standard endpoint which returns aggregated
    averages, this V2 endpoint provides granular data points over time for: concurrent user connections count, traffic in/out
    rates (request/response bits in Mbps), and request/response transaction rates. Supports two visualization modes: Summary
    view (single aggregated line - percentages averaged, other metrics summed across all Gateways) and Per-Appliance view
    (individual trend lines for each Gateway). Interactive features allow clicking data points to view min/average/max values
    for user connections, request/response bits, and request/response rates during the selected period. Essential for answering
    time-based questions: When do peak user connections occur during business hours? How did traffic rates change after
    infrastructure updates? What are the request vs response rate patterns? Time-series granularity adapts to selected time
    range. Use this for remote access capacity planning, SLA monitoring, identifying peak usage periods, and troubleshooting
    Gateway performance issues affecting user experience.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getGatewayUsageTimeSeries
  rest: GET /v2/netscaler/usage/gateway
- name: get-start-upload-date
  domain: vdi
  description: Returns date when the first historical data upload was started
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getStartUploadDate
  rest: GET /v1/uploadstartstatus
- name: get-session-statistics
  domain: vdi
  description: 'Returns comprehensive historical statistics for INDIVIDUAL USER SESSIONS across VDI/DaaS environments (Citrix
    CVAD, Omnissa Horizon). **USE THIS TOOL FOR INDIVIDUAL SESSION ANALYSIS, NOT FOR FINDING WHICH MACHINES HAVE SESSION
    PROBLEMS.** For identifying machines with session performance issues, use getMachineStatistics with metricsType=\''UserSessions\''
    instead. This tool provides detailed per-session records with different focus areas via preset types: ACTIVITY (session
    initiation, logon/logoff times, duration), CLIENT (client performance indicators like NIC speed, OS version, IP address),
    CVAD (Citrix-specific metrics: brokering duration, delivery group, StoreFront server, profile load time), HORIZON (Omnissa
    Horizon metrics: pod name, pool name, farm name, connection server), RESOURCES (resource consumption per session: CPU,
    RAM, disk I/O, GPU utilization), UX (user experience metrics per session: protocol latency, RTT, bandwidth, application
    load time, frames per second), LIST (basic session list for specific user/server, requires userAccount or serverName
    filter). Answers questions like: Which sessions had highest CPU usage? Which users had slowest logon times? What was
    average application load time for sessions? Which sessions did a specific user initiate? What were the connection details
    for a user\''s sessions? Filter by user account, server name, EUC site, branch, folder, or logon duration range. Essential
    for deep-dive session analysis, troubleshooting specific user complaints, analyzing session timing and connectivity,
    and identifying user experience issues at the individual session level. Returns one row per session. Default sort: logoff
    time descending.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getSessionsStatistics
  rest: GET /v1/sessions
- name: get-individual-session-details
  domain: vdi
  description: 'Returns comprehensive activity details for a specific user session identified from Session Activity report.
    Provides drill-down view showing: session events timeline (logon/logoff, connect/disconnect events with timestamps),
    client information (IP address, machine name, OS type/version, NIC speed, Citrix Receiver/Horizon Client versions, branch
    location), active applications (running apps during session with usage times), active URLs accessed, protocol details
    (HDX/RDP/Blast/PCoIP with bandwidth and latency), performance metrics (CPU, RAM, disk I/O, GPU utilization over session
    duration), user experience data (protocol latency, RTT, frames per second, application load times), and platform-specific
    details (CVAD: brokering duration, delivery group, StoreFront server, profile load time; Horizon: pod name, pool name,
    connection server, farm name). Essential for deep-dive troubleshooting of individual session problems: Why did this
    user experience slow performance? What applications were running when the issue occurred? What were the network conditions
    during the session? Use sessionUid from getSessionStatistics results to identify the specific session to investigate.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getSessionDetails
  rest: GET /v1/sessions/details
- name: get-session-timeline
  domain: vdi
  description: Returns the timeline of session state changes for a specific session.
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getSessionTimeline
  rest: GET /v1/sessions/timeline/{sessionUid}
- name: get-application-statistics
  domain: vdi
  description: 'Returns comprehensive historical usage statistics and resource consumption metrics for all applications
    running on monitored machines, aggregated per application version. Provides organization-wide visibility into application
    adoption and performance across the entire application portfolio. **DO NOT use this tool when asked about a specific
    application by name** - use getUsageDetailsForAnApplication instead for queries like "Chrome usage" or "Excel statistics".
    This tool is for answering broad questions like: What are the most used applications in my organization? Which applications
    consume the most resources (CPU, GPU, memory, I/O) across all apps? Are there resource usage differences between different
    versions of the same application? Which apps should we prioritize for optimization or upgrade? What is our complete
    application inventory? Metrics include: unique user count and trend (percentage change from previous period), peak concurrent
    instances (highest number of processes running simultaneously, counted using 5-minute interval sampling), average resource
    consumption (CPU, GPU, memory, read/write/total I/O operations), average application load time, total instances and
    duration, unique machines running the app, and Top 10% highest CPU consumers. Statistics are aggregated weekly (Monday-Sunday)
    or monthly depending on timeFrame parameter. Data spans previous 12 months. Default sort: by unique users descending.
    Essential for capacity planning, license optimization, identifying resource-hungry applications, comparing performance
    across application versions, tracking application adoption trends, and making informed decisions about application lifecycle
    management.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getAppStats
  rest: GET /v1/applications/statistics
- name: get-usage-details-for-all-applications
  domain: vdi
  description: 'Returns detailed usage statistics for all applications including peak concurrent users/instances throughout
    the specified search period. For each application version, provides: number of unique users who ran the application,
    and peak concurrency (the highest number of instances/processes running simultaneously across all machines, sampled
    at intervals). Essential for answering questions like: What are the peak concurrent users for applications? How many
    instances of an application run at the same time? Which applications have the highest concurrent usage? The granularity
    of peak concurrency data and time-series breakdown depends on the length and recency of the search period. Data is returned
    per application version. Use this for capacity planning, license optimization based on concurrent usage, and identifying
    peak load times for applications.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getAppUsage
  rest: GET /v1/applications/usage/all
- name: get-usage-details-for-an-application
  domain: vdi
  description: 'Returns detailed usage statistics for a specific application identified by its exact name. **USE THIS TOOL
    when the user asks about a specific application by name (e.g., "Chrome usage", "Excel statistics", "Outlook activity").**
    Provides comprehensive drill-down view including: usage per machine (which computers ran the app), usage per user account
    (which users launched it), peak concurrent instances over time (maximum number of processes running simultaneously,
    sampled at 5-minute intervals), and time-series data showing usage patterns throughout the search period. The granularity
    of peak concurrent instances data depends on the length and recency of the search period. Essential for answering: Which
    users/machines use this application? When are peak usage times? How many concurrent instances do we need to license?
    What is the usage trend over time? Use appVersion parameter to filter to a specific version if the application has multiple
    versions tracked separately.\nFor discovering what applications exist or comparing usage across multiple applications,
    use getApplicationStatistics instead.'
  source_operation: openapi/controlup-vdi-daas-historical-openapi.yml#getAppUsageSingle
  rest: GET /v1/applications/usage/single
