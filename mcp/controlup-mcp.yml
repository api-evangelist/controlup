- name: execute-custom-query
  domain: cu4d
  description: 'Execute a custom Elasticsearch query against available indexes. Use this tool when existing tools don''t
    cover your specific query requirements. # INDEX DOCUMENTATION For complete field reference, see: src/docs/elasticsearch-indexes.md
    For TypeScript definitions, see: src/docs/elasticsearch-indexes.ts # AVAILABLE INDEXES AND FIELD MAPPINGS ## 1. _devices
    (Current Device State) Real-time device information snapshot. Use for current device status queries. **Fields:** | Field
    | Type | Description | |-------|------|-------------| | _id | keyword | Device document ID | | _device_id | keyword
    | Unique device identifier | | name | text/keyword | Device name (use .keyword for exact match) | | dns_name | text/keyword
    | DNS hostname | | platform | integer | Platform: 1=Windows, 2=macOS, 3=Linux | | is_online | boolean | Current online
    status | | last_communication | date | Last communication timestamp | | group | text/keyword | Device group name | |
    tags | keyword[] | Device tags array | | agent_version | text/keyword | Agent version string | | agent_manager_version
    | text/keyword | Agent manager version | | auto_update_mode | keyword | Update mode (PRODUCTION, etc.) | | os_name |
    text/keyword | Full OS name | | os_version | text/keyword | OS version | | os_patch | text/keyword | OS patch level
    | | os_architecture | keyword | Architecture (x64, arm64) | | hw_manufacturer | text/keyword | Hardware manufacturer
    | | hw_model | text/keyword | Hardware model | | hw_cpu | text/keyword | CPU model | | hw_memory_total_bytes | long
    | Total RAM in bytes | | hw_gpu | text/keyword | GPU model | | console_user | text/keyword | Current logged-in user
    | | console_user_upn | text/keyword | User principal name (email) | | console_user_display_name | text/keyword | User
    display name | | console_user_dept | text/keyword | User department | | console_user_manager | text/keyword | User''s
    manager | | active_usernames | keyword[] | Active usernames array | | activesessions | integer | Active session count
    | | public_ip | keyword | Public IP address | | public_ip_city | text/keyword | City from geo-IP | | public_ip_state
    | text/keyword | State/region from geo-IP | | public_ip_country | text/keyword | Country from geo-IP | | public_ip_timezone
    | keyword | Timezone from geo-IP | | network_interfaces | nested | Network interface objects | | latency_target | keyword
    | Ping target address | | ping_avg | float | Average ping in ms | | cpu_perc | float | CPU usage percentage | | cpu_total_percentage
    | float | Total CPU percentage (for scoring) | | cpuqueuelength | integer | CPU queue length | | memory_total_bytes_used
    | long | Used memory in bytes | | memory_total_bytes_available | long | Available memory in bytes | | total_used_disk
    | long | Used disk space in bytes | | total_free_disk | long | Free disk space in bytes | | bytes_received_per_sec |
    long | Network bytes in per second | | bytes_sent_per_sec | long | Network bytes out per second | | wifi_signal | integer
    | WiFi signal strength (0-100) | | latency_result_1 | float | Latency measurement in ms | | foreground_app | text/keyword
    | Current foreground application | | app_crashes | integer | App crash count (recent) | | app_freezes | integer | App
    freeze count | | hangs | integer | Application hang count | | bsods | integer | Blue screen count | | hw_battery_health_percentage
    | integer | Battery health % | | user_input_delay_max | integer | Max user input delay in ms | | user_logon_duration
    | integer | User logon duration in ms | ## 2. device_status (Historical Device Metrics) Time-series performance data.
    Use for historical trends and time-based aggregations. **Key Fields:** | Field | Type | Description | |-------|------|-------------|
    | _device_id | keyword | Device identifier | | _device_name | text/keyword | Device name | | _created_local | date |
    Timestamp (primary time field) | | created_local | date | Alternative timestamp field | | cpu_perc | float | CPU usage
    percentage | | cpu_total_percentage | float | Total CPU percentage | | mem_perc | float | Memory usage percentage |
    | memory_total_bytes_used | long | Memory used in bytes | | memory_total_bytes_available | long | Memory available in
    bytes | | wifi_signal | integer | WiFi signal strength | | latency_result_1 | float | Network latency in ms | | total_used_disk
    | long | Used disk in bytes | | total_free_disk | long | Free disk in bytes | | bytes_received_per_sec | long | Network
    bytes in | | bytes_sent_per_sec | long | Network bytes out | | foreground_app | text/keyword | Active application |
    | foreground_app_friendly_name | text/keyword | Friendly app name | | console_user_upn | text/keyword | User principal
    name | | platform | integer | Platform (1=Win, 2=Mac) | | public_ip_country | text/keyword | Country | | public_ip_city
    | text/keyword | City | | dex_score | float | DEX score at this point | ## 3. installed_apps (Installed Applications)
    Software inventory across devices. **Fields:** | Field | Type | Description | |-------|------|-------------| | _device_id
    | keyword | Device identifier | | _device_name | text/keyword | Device name | | name | text/keyword | Application name
    | | version | text/keyword | Application version | | publisher | text/keyword | Application publisher | | platform |
    integer | Platform (1=Win, 2=Mac) | | installdate | keyword | Install date string | | iso_install_date | date | Install
    date (ISO format) | | source | keyword | Installation source | | uninstall_string | text | Uninstall command | | bits
    | keyword | Architecture (32/64 bit) | | _created | date | Record creation time | | _created_local | date | Local timestamp
    | ## 4. win_event_log (Windows Event Logs) Windows system and application events. Use for crash analysis and system
