    | Field | Type | Description | |-------|------|-------------| | _device_id | keyword | Device identifier | | _device_name
    | text/keyword | Device name | | logonstart | date | Logon start time | | logonduration_ms | long | Logon duration in
    ms | | userprofileduration_ms | long | Profile load duration | | grouppolicycsesduration_ms | long | Group policy duration
    | | console_user_upn | text/keyword | User principal name | | _created_local | date | Record timestamp | ## 8. app_focus
    (Application Focus Time) Application usage and focus duration tracking. **Fields:** | Field | Type | Description | |-------|------|-------------|
    | _device_id | keyword | Device identifier | | _device_name | text/keyword | Device name | | foreground_app | text/keyword
    | Application name | | foreground_app_friendly_name | text/keyword | Friendly app name | | duration_ms | long | Focus
    duration in ms | | console_user_upn | text/keyword | User principal name | | _created_local | date | Focus start timestamp
    | ## 9. groups (Device Groups) Device group definitions. **Fields:** | Field | Type | Description | |-------|------|-------------|
    | name | text/keyword | Group name | | description | text | Group description | ## 10. tags (Device Tags) Device tag
    definitions. **Fields:** | Field | Type | Description | |-------|------|-------------| | name | text/keyword | Tag name
    | # QUERY BUILDING GUIDE ## Basic Query Structure \`\`\`json { "index": "_devices", "query": { "_source": ["name", "platform",
    "cpu_perc"], "size": 50, "from": 0, "query": { "bool": { "must": [...], "filter": [...], "should": [...], "must_not":
    [...] } }, "sort": [{"name.keyword": "asc"}], "aggs": {...} } } \`\`\` ## Common Query Patterns ### Term Query (exact
    match): \`\`\`json {"term": {"platform": 1}} \`\`\` ### Terms Query (multiple values): \`\`\`json {"terms": {"platform":
    [1, 2]}} \`\`\` ### Wildcard Query (partial match on text/keyword fields): \`\`\`json {"wildcard": {"name.keyword":
    "*PROD*"}} \`\`\` ### Range Query (numbers, dates): \`\`\`json {"range": {"cpu_perc": {"gte": 80}}} {"range": {"_created_local":
    {"gte": "2025-01-01T00:00:00Z", "lte": "2025-01-05T23:59:59Z"}}} \`\`\` ### Bool Query (combine conditions): \`\`\`json
    { "bool": { "must": [ {"term": {"platform": 1}}, {"range": {"cpu_perc": {"gte": 80}}} ], "filter": [ {"term": {"is_online":
    true}} ] } } \`\`\` ## Aggregation Patterns ### Terms Aggregation (group by): \`\`\`json { "aggs": { "by_platform":
    { "terms": {"field": "platform", "size": 10} } } } \`\`\` ### Date Histogram (time series): \`\`\`json { "aggs": { "over_time":
    { "date_histogram": { "field": "_created_local", "calendar_interval": "1h" }, "aggs": { "avg_cpu": {"avg": {"field":
    "cpu_perc"}} } } } } \`\`\` ### Cardinality (unique count): \`\`\`json { "aggs": { "unique_devices": {"cardinality":
    {"field": "_device_id.keyword"}} } } \`\`\` ## Field Type Notes - Use \`.keyword\` suffix for exact matching on text
    fields (e.g., \`name.keyword\`, \`console_user.keyword\`) - Numeric fields (integer, long, float) don''t need .keyword
    suffix - Date fields use ISO 8601 format: \`2025-01-05T12:00:00Z\` - Boolean fields use true/false (not "true"/"false")
    - For time-based queries on historical data, use \`_created_local\` field ## Example Use Cases 1. "Find all Windows
    devices with CPU > 90%": Index: _devices, filter: platform=1 AND cpu_perc > 90 2. "Count crashes per application in
    last 7 days": Index: win_event_log, filter: event_level=2, agg: terms on process_name.keyword 3. "Get average CPU by
    device group over last 24 hours": Index: device_status, date_histogram on _created_local with avg(cpu_total_percentage),
    grouped by group.keyword'
  rest: POST /cu4d-dal-mcp/custom-query
  source_operation: null
