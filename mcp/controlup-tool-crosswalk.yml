- tool: delete-saml-settings
  category: platform-administration
  reason: The MCP server calls DELETE /v1/organizations/{orgId}/saml, but the published DEX platform OpenAPI declares only
    GET, POST and PATCH on that path plus POST /saml/{idpName}. No DELETE operation is documented — a real spec/implementation
    divergence.
- tool: list-devices
  category: desktop-telemetry
  reason: Served by the /cu4d-dal-mcp data-access-layer path, which is not present in any of the twelve OpenAPI definitions
    in ControlUp's /.well-known/api-catalog. The ControlUp for Desktops REST spec (openapi/controlup-desktops-openapi.yml)
