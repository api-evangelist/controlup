product_version_lifecycle:
  policy_url: https://support.controlup.com/docs/controlup-product-version-lifecycle-quick-guide
  phases:
  - phase: General Availability (GA)
    meaning: Latest stable version with complete feature updates, bug fixes and support.
  - phase: End of Maintenance (EOM)
    meaning: Security updates only; no regular bug fixes.
  - phase: End of Support (EOS)
    meaning: No technical support or updates. Reached 18 months after the next version's GA date.
  per_product_policies:
