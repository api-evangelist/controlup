  - product: ControlUp On-Premises (COP)
    url: https://support.controlup.com/docs/controlup-version-lifecycle-on-premises-only
  caveats:
  - Applies only to customers who purchased ControlUp software directly.
  - Covers ControlUp software only, not third-party software or hardware used with it.
  - ControlUp reserves the right to change the policy without prior notice.
