schema_graph:
  total_schemas: 563
  total_ref_relationships: 599
  note: Counted across all twelve definitions. The most-referenced shared shapes are UserMetadata (31 references), DiscoverableResourceType
    (14), ErrorResponseMetadata (10), CloudProvider (10), CloudProviderAuthType (9), OrganizationProductAllocation (8),
    MetricDataPoint (7) and VmSecurityType (7). There is no shared component library across definitions — each product surface
    redeclares its own schemas, so the same real-world concept (a device, an organization) has a different schema in each
    spec.
  cross_spec_reuse: false
cross_domain_keys:
- key: orgId
  description: Organization identifier. Path parameter on every ControlUp ONE Platform operation and the ORG_ID the MCP
    server requires. The tenancy boundary for the whole estate.
- key: device id
  description: A device is the central entity in both ControlUp for Desktops and ControlUp for Compliance, but the two products
    address it through separate specs and separate path spaces (/edge/api/devices vs /compliance/devices) with no documented
    shared identifier.
- key: scoutId
  description: Synthetic Monitoring Scout. Parent of alert policies, test results and triggered alerts.
- key: flowId / integrationId
  description: Workflows. A flow has runs; an integration has actions addressed by nodeType, each with its own input/output
    schema.
