                  type: integer
                  description: ID of the Custom Hive running the Scout that triggered the alert.
                stateCount:
                  description: A counter that increases by 1 for each subsequent time the alert status is "TRIGGERED". `stateCount` starts at -1, and returns to -1 when the alert status is "OK".
