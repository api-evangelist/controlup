            type: integer
          triggers:
            type: array
            description: 'An array containing an entry for each time an alert is triggered, or is no longer triggered and returns to a normal status.


              In addition to the documented properties below, each entry also contains the test result values that caused the trigger to activate or return to a normal status. The names of these properties are dynamic and depend on the alert configuration.

              '
