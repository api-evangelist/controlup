              properties:
                alertLevel:
                  description: The Scout's alert status. The status is "TRIGGERED" for each time the alert is triggered, which can be multiple times in a row. The status is "OK" only when the alert policy is no longer triggered and the Scout returns to a normal status.
                  type: string
                  enum:
                  - OK
                  - TRIGGERED
