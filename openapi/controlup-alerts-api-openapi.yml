    AlertTriggerSettings:
      title: Alert Trigger Settings
      description: 'Settings that control when and how alerts are triggered.

        '
      type: object
      properties:
        sendOnStatusChange:
          type: boolean
          description: 'If `true`, notifications are sent only when the alert status changes, to prevent excessive notifications. This means that if the Scout

            triggers the alert 10 times in a row, you''ll receive one notification when the Scout first triggers the alert, and another notification

            when the Scout recovers.


            If `false`, notifications are sent every time the alert triggers. This means that if something goes wrong and the Scout

            starts triggering the alert, you''ll receive a notification every time the Scout runs.

            '
          default: true
          example: true
        consecutiveMatchCount:
          type: integer
          description: "Number of consecutive test results that must match the alert conditions before \nthe alert is triggered. This helps prevent false positives from temporary issues.\n"
          minimum: 1
          default: 1
          example: 2
        attachOutput:
          type:
          - boolean
          - 'null'
          description: "Relevant for Shell Scouts only. Attach the test output to alert notifications. When enabled, the notification \npayload will include additional details about the test result that triggered the alert.\n"
          example: true
        evaluationScope:
          type: string
          description: "Scope for evaluating consecutive matches.\n\n- `GLOBAL`: Evaluate consecutive matches across all specified hives (or all hives if targetHives is not specified).\n  The alert triggers when the required consecutive count is met across any combination of the target hives.\n- `PER_HIVE`: Evaluate consecutive matches separately for each hive. \n  The alert triggers when any single hive meets the required consecutive count.\n"
          enum:
          - GLOBAL
          - PER_HIVE
          default: GLOBAL
          example: GLOBAL
        targetHives:
          title: Target Hives
          description: "Sets which hives to include in the consecutive match evaluation.\nThis is only used when `evaluationScope` is set to `GLOBAL`. \nIf not specified when evaluationScope is GLOBAL, all hives are evaluated.\n"
          type: object
          properties:
            cloudHiveIds:
              type: array
              description: List of Cloud Hive IDs to include in alert evaluation
              items:
                type: integer
                format: int32
                minimum: 1
              default: []
            customHiveIds:
              type: array
              description: List of Custom Hive IDs to include in alert evaluation
              items:
                type: integer
                format: int32
                minimum: 1
              default: []
              example:
                cloudHiveIds:
                - 1
                - 2
                - 3
                customHiveIds:
                - 4
                - 5
