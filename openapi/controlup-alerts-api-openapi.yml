                properties:
                  conds:
                    description: An array containing the alert conditions for the Scout. The array contains additional 'conds' arrays if there are nested alert conditions (for example, X AND (Y OR Z)).
                    type: array
                    items:
                      type: object
                      properties:
                        conditionType:
                          type: string
