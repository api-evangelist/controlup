          - toDate
          - fromDate
          - unit
          - metric
          - areaOfInterest
          type: object
          description: Response metadata
        dailyData:
          items:
            $ref: '#/components/schemas/DailyMetricBucket'
          type: array
          description: Daily time series data (up to 14 buckets)
        summary:
          $ref: '#/components/schemas/DailyMetricPeriodSummary'
          description: Overall summary for the entire period (up to 14 days)
      required:
      - summary
      - dailyData
      - meta
      type: object
      additionalProperties: true
    MetricPeriodSummary:
      description: Summary statistics for a time period.
      properties:
        max:
          type: number
          format: double
          nullable: true
          description: Maximum value across the period
        min:
          type: number
          format: double
          nullable: true
          description: Minimum value across the period
        average:
          type: number
          format: double
          nullable: true
          description: Average value across the period
      required:
      - average
      - min
      - max
      type: object
      additionalProperties: true
    HourlyMetricBucket:
      description: A single hourly data point for Graph 2.
      properties:
        stdDev:
          type: number
          format: double
          nullable: true
          description: Population standard deviation for the hour
        max:
          type: number
          format: double
          nullable: true
          description: Maximum value for the hour
        min:
          type: number
          format: double
          nullable: true
          description: Minimum value for the hour
        avg:
          type: number
          format: double
          nullable: true
          description: Average value for the hour
        hour:
          type: string
          description: Hour label for display (e.g., "14:00")
        timestamp:
          type: string
          description: ISO timestamp of the hour start (e.g., "2026-02-09T14:00:00.000Z")
      required:
      - timestamp
      - hour
      - avg
      - min
      - max
      - stdDev
      type: object
      additionalProperties: true
    HourlyMetricHistoryResponse:
      description: 'Response for hourly aggregated metric history for a specific day (Graph 2).

        Shows 24 hours of data for the selected day.'
      properties:
        meta:
          properties:
            hasEnoughData:
              type: boolean
              description: False if no data available for this day
            hoursWithData:
              type: number
              format: double
              description: Number of hours with data
            toDate:
              type: string
              description: End of the day (ISO timestamp)
            fromDate:
              type: string
              description: Start of the day (ISO timestamp)
            date:
              type: string
              description: The date being queried (ISO date string)
            unit:
              $ref: '#/components/schemas/MetricUnit'
              description: The unit of the metric values (percent, bytes, ms, count, etc.)
            metric:
              type: string
            areaOfInterest:
              type: string
          required:
          - hasEnoughData
          - hoursWithData
          - toDate
          - fromDate
          - date
          - unit
          - metric
          - areaOfInterest
          type: object
          description: Response metadata
        hourlyData:
          items:
            $ref: '#/components/schemas/HourlyMetricBucket'
          type: array
          description: Hourly time series data (up to 24 buckets)
        summary:
          $ref: '#/components/schemas/MetricPeriodSummary'
          description: Summary for the specific day
      required:
      - summary
      - hourlyData
      - meta
      type: object
      additionalProperties: true
    Record_string.AllDaysHourlyDayEntry_:
      properties: {}
      type: object
      description: Construct a type with a set of properties K of type T
    AllDaysHourlyMetricHistoryResponse:
      description: 'Response for all-days hourly data (CH flow only).

        Returns all 336 hourly buckets grouped by date, plus cross-day stats.'
      properties:
        meta:
          properties:
            totalDays:
              type: number
              format: double
            toDate:
              type: string
            fromDate:
              type: string
            unit:
              $ref: '#/components/schemas/MetricUnit'
            metric:
              type: string
            areaOfInterest:
              type: string
          required:
          - totalDays
          - toDate
          - fromDate
          - unit
          - metric
          - areaOfInterest
          type: object
        stats:
          properties:
            hourlyStdDevMax:
              type: number
              format: double
              nullable: true
            hourlyAvgMax:
              type: number
              format: double
              nullable: true
          required:
          - hourlyStdDevMax
          - hourlyAvgMax
          type: object
          description: Cross-day stats for stable Y-axis on hourly chart
        days:
          $ref: '#/components/schemas/Record_string.AllDaysHourlyDayEntry_'
          description: Per-day hourly data keyed by YYYY-MM-DD
      required:
      - days
      - stats
      - meta
      type: object
      additionalProperties: true
    MetricWindowBucket:
      description: 'A single time bucket in the metric window response.


        Buckets are returned at the granularity requested by the caller; the

        frontend is responsible for any slot-filling / gap rendering since the

        window range is also caller-supplied.'
      properties:
        stdDev:
          type: number
          format: double
          nullable: true
        max:
          type: number
          format: double
          nullable: true
        min:
          type: number
          format: double
          nullable: true
        avg:
          type: number
          format: double
          nullable: true
        timestamp:
          type: string
          description: Bucket start (ISO timestamp, UTC).
      required:
      - timestamp
      - avg
      - min
      - max
      - stdDev
      type: object
      additionalProperties: true
    MetricWindowGranularity:
      type: string
      enum:
      - 1m
      - 5m
      - 15m
      - 30m
      - hour
      - day
      description: 'Granularity values exposed by the metric-window endpoint.


        Sub-hour granularities (1m / 5m / 15m / 30m) are required by the anomaly

        side-panel chart for short-duration anomalies. Both the ClickHouse and

        Elasticsearch flows support all listed granularities.'
    MetricWindowResponse:
      properties:
        meta:
          properties:
            hasEnoughData:
              type: boolean
            bucketsWithData:
              type: number
              format: double
              description: Number of buckets that contained any data.
            degraded:
              type: boolean
              description: Reserved for future use; currently always false.
            granularity:
              $ref: '#/components/schemas/MetricWindowGranularity'
              description: Granularity actually used when querying.
            to:
              type: string
              description: Echo of the requested window end.
            from:
              type: string
              description: Echo of the requested window start.
            unit:
              $ref: '#/components/schemas/MetricUnit'
            metric:
              type: string
            areaOfInterest:
              type: string
          required:
          - hasEnoughData
          - bucketsWithData
          - degraded
          - granularity
          - to
          - from
          - unit
          - metric
          - areaOfInterest
          type: object
        data:
          items:
            $ref: '#/components/schemas/MetricWindowBucket'
          type: array
      required:
      - data
      - meta
      type: object
      additionalProperties: true
    GetMetricWindowRequest:
      description: 'Request body for the anomaly metric-window endpoint.


        Unlike the daily/hourly endpoints, the time range and granularity are fully

        decided by the caller (the side-panel chart). The endpoint is otherwise

        stateless: it does not look up any anomaly metadata, it just runs the query.'
      properties:
        scopeLogic:
          $ref: '#/components/schemas/ScopeLogic'
          description: 'Optional: How to combine groupId and tagIds when both are set (''OR'' default)'
        deviceIds:
          items:
            type: string
          type: array
          description: 'Optional: Specific device IDs to filter by'
        tagIds:
          items:
            type: string
          type: array
          description: 'Optional: Tag IDs to filter by'
        groupId:
          type: string
          description: 'Optional: Single group ID to filter by'
        granularity:
          $ref: '#/components/schemas/MetricWindowGranularity'
          description: Bucket size for the time-series aggregation.
        to:
          type: string
          description: Exclusive end of the window (ISO timestamp).
        from:
          type: string
          description: Inclusive start of the window (ISO timestamp).
        metric:
          type: string
          description: The metric field (snake_case) - e.g., 'cpu_load'
        areaOfInterest:
          type: string
          description: The area of interest (category) - e.g., 'device_status', 'process_stops'
      required:
      - areaOfInterest
      - metric
      - from
      - to
      - granularity
      type: object
      additionalProperties: true
    Record_string.string_:
      properties: {}
      type: object
      description: Construct a type with a set of properties K of type T
    Record_string.Record_string.string__:
      properties: {}
      type: object
      description: Construct a type with a set of properties K of type T
    DisplayNamesResponse:
      description: Full display name mapping for all categories and their metrics.
      properties:
        metrics:
          $ref: '#/components/schemas/Record_string.Record_string.string__'
          description: 'Metrics nested by area: { [area]: { [metric]: displayName } }'
        categories:
          $ref: '#/components/schemas/Record_string.string_'
      required:
      - categories
      - metrics
      type: object
      additionalProperties: true
    Partial_CreateAnomalyAlertRequest_:
      properties:
        scopeLogic:
          $ref: '#/components/schemas/ScopeLogic'
          description: 'Scope logic for group/tags filtering: OR = match any (default), AND = require both group and at least
            one tag'
        seasonality:
          allOf:
          - $ref: '#/components/schemas/AnomalySeasonality'
          nullable: true
          description: Seasonality pattern for baseline calculation
        thresholdDurationMinutes:
          type: number
          format: double
          description: Duration in minutes for threshold violation (1-43200, i.e., 1 minute to 30 days)
        flow:
          type: string
          description: Workflow ID to trigger
        emailAddresses:
          items:
            $ref: '#/components/schemas/Email'
          type: array
          description: Email addresses for notifications
        tags:
          items:
            type: string
          type: array
          description: Tags for aggregation
        group:
          type: string
          description: Group identifier for aggregation
        devices:
          items:
            type: string
          type: array
          description: List of device IDs to filter (optional)
        triggerType:
          $ref: '#/components/schemas/AnomalyTriggerType'
          description: Trigger type for the alert
        thresholdDirection:
          $ref: '#/components/schemas/AnomalyDirection'
          description: Direction of threshold violation
        zscoreThreshold:
          type: number
          format: double
          description: 'Z-score threshold for anomaly detection (1-5, default: 3)'
        anomalyField:
          type: string
          description: The field to monitor for anomalies (e.g., cpu_load, memory_available_percentage)
        areaOfInterest:
          $ref: '#/components/schemas/AreaOfInterest'
          description: The area of interest for the alert (e.g., process_stops, win11_readiness)
        severity:
          $ref: '#/components/schemas/AnomalySeverity'
          description: The alert's severity level
        enabled:
          type: boolean
          description: Whether the alert is enabled
        description:
          type: string
          description: The alert's description
        name:
          type: string
          description: The alert's name
      type: object
      description: Make all properties in T optional
    UpdateAnomalyAlertRequest:
      $ref: '#/components/schemas/Partial_CreateAnomalyAlertRequest_'
    DeleteAnomalyAlertResponse:
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
      - message
      - success
      type: object
    LicensingEnums.Product:
      properties: {}
      type: object
      additionalProperties: true
    Pick_LicenseSnapshot.hasActiveLicense-or-features-or-products_:
      properties:
        products:
          items:
            $ref: '#/components/schemas/LicensingEnums.Product'
          type: array
        features:
          items:
            type: string
          type: array
        hasActiveLicense:
          type: boolean
      required:
      - hasActiveLicense
      - features
      - products
      type: object
      description: From T, pick a set of properties whose keys are in the union K
    LicenseDetailsResponse:
      $ref: '#/components/schemas/Pick_LicenseSnapshot.hasActiveLicense-or-features-or-products_'
