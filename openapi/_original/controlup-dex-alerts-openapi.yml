    ErrorCode.Forbidden:
      enum:
      - 4
      type: number
    HttpStatusCode.FORBIDDEN:
      enum:
      - 403
      type: number
    ErrorType_ErrorMessage.Forbidden.HttpStatusCode.FORBIDDEN.ErrorCode.Forbidden_:
      properties:
        message:
          $ref: '#/components/schemas/ErrorMessage.Forbidden'
        code:
          $ref: '#/components/schemas/ErrorCode.Forbidden'
        status:
          $ref: '#/components/schemas/HttpStatusCode.FORBIDDEN'
        data:
          additionalProperties: true
          type: object
      required:
      - status
      - code
      - message
      type: object
    ErrorResponseBody_ErrorType_ErrorMessage.Forbidden.HttpStatusCode.FORBIDDEN.ErrorCode.Forbidden__:
      properties:
        metadata:
          $ref: '#/components/schemas/ErrorResponseMetadata'
        error:
          $ref: '#/components/schemas/ErrorType_ErrorMessage.Forbidden.HttpStatusCode.FORBIDDEN.ErrorCode.Forbidden_'
      required:
      - error
      - metadata
      type: object
    ForbiddenErrorType:
      $ref: '#/components/schemas/ErrorResponseBody_ErrorType_ErrorMessage.Forbidden.HttpStatusCode.FORBIDDEN.ErrorCode.Forbidden__'
    ErrorMessage.NotFound:
      enum:
      - Not Found
      type: string
    ErrorCode.NotFound:
      enum:
      - 5
      type: number
    HttpStatusCode.NOT_FOUND:
      enum:
      - 404
      type: number
    ErrorType_ErrorMessage.NotFound.HttpStatusCode.NOT_FOUND.ErrorCode.NotFound_:
      properties:
        message:
          $ref: '#/components/schemas/ErrorMessage.NotFound'
        code:
          $ref: '#/components/schemas/ErrorCode.NotFound'
        status:
          $ref: '#/components/schemas/HttpStatusCode.NOT_FOUND'
        data:
          additionalProperties: true
          type: object
      required:
      - status
      - code
      - message
      type: object
    ErrorResponseBody_ErrorType_ErrorMessage.NotFound.HttpStatusCode.NOT_FOUND.ErrorCode.NotFound__:
      properties:
        metadata:
          $ref: '#/components/schemas/ErrorResponseMetadata'
        error:
          $ref: '#/components/schemas/ErrorType_ErrorMessage.NotFound.HttpStatusCode.NOT_FOUND.ErrorCode.NotFound_'
      required:
      - error
      - metadata
      type: object
    NotFoundErrorType:
      $ref: '#/components/schemas/ErrorResponseBody_ErrorType_ErrorMessage.NotFound.HttpStatusCode.NOT_FOUND.ErrorCode.NotFound__'
    SourceName:
      enum:
      - desktop
      type: string
    Severity:
      enum:
      - informational
      - low
      - medium
      - high
      - critical
      type: string
    AlertConfigBaseDTO:
      properties:
        sourceName:
          $ref: '#/components/schemas/SourceName'
          description: The ControlUp product area related to the alert.
        name:
          type: string
          description: The alert's name.
        description:
          type: string
          description: The alert's description.
        severity:
          $ref: '#/components/schemas/Severity'
          description: The alert's severity level.
        enabled:
          type: boolean
          description: Whether the alert is enabled.
      required:
      - enabled
      - severity
      - name
      - sourceName
      type: object
    AlertMetadataDTO:
      allOf:
      - $ref: '#/components/schemas/AlertConfigBaseDTO'
      - properties:
          lastTriggeredUtcTime:
            type: string
            format: date-time
            description: The time the alert was last triggered.
          lastModifiedUtcTime:
            type: string
            format: date-time
            description: The time the alert was last modified.
          lastModifiedBy:
            type: string
            nullable: true
          id:
            type: string
            description: The alert's ID.
        required:
        - lastModifiedUtcTime
        - lastModifiedBy
        - id
        type: object
    APIResponse_AlertMetadataDTO-Array_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AlertMetadataDTO'
          type: array
          nullable: true
      required:
      - data
      type: object
    PaginatedResponseMetadata:
      properties:
        total:
          type: number
          format: double
          description: The total number of results across all pages.
        limitPerPage:
          type: number
          format: double
          description: The maximum number of results returned per page (set by the `_limit` parameter).
        currentPageNumber:
          type: number
          format: double
          description: The page of result returned (set by the `_page` parameter).
        currentPageSize:
          type: number
          format: double
          description: The number of results on the current page.
        remaining:
          type: number
          format: double
          description: The total number of results on all pages higher than the current page.
      required:
      - remaining
      - currentPageSize
      - currentPageNumber
      - limitPerPage
      - total
      type: object
      example:
        total: 18
        limitPerPage: 10
        currentPageNumber: 1
        currentPageSize: 10
        remaining: 8
    APIPaginatedResponse_AlertMetadataDTO-Array_:
      allOf:
      - $ref: '#/components/schemas/APIResponse_AlertMetadataDTO-Array_'
      - properties:
          metadata:
            allOf:
            - $ref: '#/components/schemas/PaginatedResponseMetadata'
            - additionalProperties: true
              type: object
        required:
        - metadata
        type: object
    GetAlertsMetadataResponse:
      $ref: '#/components/schemas/APIPaginatedResponse_AlertMetadataDTO-Array_'
    UUID:
      type: string
      format: uuid
      description: 'Stringified UUIDv4.

        See [RFC 4112](https://tools.ietf.org/html/rfc4122)'
      pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
    QueryParams:
      properties:
        filters:
          type: string
          description: "JSON filter for narrowing results. Send this value as a URL-encoded JSON string.\n\nExample:\n```\n\
            %7B%22and%22%3A%20%5B%7B%22filter%22%3A%20%7B%22key%22%3A%20%22type%22%2C%20%22op%22%3A%20%22equals%22%2C%20%22value%22%3A%20%22anomaly%22%7D%7D%2C%7B%22filter%22%3A%20%7B%22key%22%3A%20%22severity%22%2C%20%22op%22%3A%20%22equals%22%2C%20%22value%22%3A%20%22low%22%7D%7D%5D%7D\n\
            ```\n\nDecoded value:\n```\n{\n  \"and\": [\n    {\n      \"filter\": {\n        \"key\": \"type\",\n        \"\
            op\": \"equals\",\n        \"value\": \"anomaly\"\n      }\n    },\n    {\n      \"filter\": {\n        \"key\"\
            : \"severity\",\n        \"op\": \"equals\",\n        \"value\": \"low\"\n      }\n    }\n  ]\n}\n```"
        _search:
          type: string
          description: 'A search filter that is applied to all fields.

            Only results that contain the specified string are returned.'
        _order:
          type: string
          enum:
          - asc
          - desc
          description: The sort order (ascending / descending) of the field specified by the `_sortBy` parameter.
          example: asc
          default: asc
        _sortBy:
          type: string
          description: Sorts results according to the specified field.
          example: id
          default: id
        _limit:
          type: integer
          format: int32
          description: The number of results returned per page.
          example: 10
          default: '10'
          minimum: 1
        _page:
          type: integer
          format: int32
          description: 'The page of results to return.

            The first page is page number 1.'
          example: 1
          default: '1'
          minimum: 1
      type: object
      additionalProperties: true
    AlertConfigBySourceIdResponse:
      properties:
        id:
          type: string
        sourceName:
          $ref: '#/components/schemas/SourceName'
        sourceAlertId:
          type: string
      required:
      - sourceAlertId
      - sourceName
      - id
      type: object
    FilterOptionItem:
      description: A single filter option item
      properties:
        count:
          type: number
          format: double
          description: Number of alerts with this value
        label:
          type: string
          description: Display label (same as value by default)
        value:
          type: string
          description: The filter option value
      required:
      - value
      - label
      - count
      type: object
      additionalProperties: true
    FilterOptionsResponse:
      description: Response from filter-options endpoint
      properties:
        hasMore:
          type: boolean
          description: Whether there are more results beyond this page
        data:
          items:
            $ref: '#/components/schemas/FilterOptionItem'
          type: array
          description: Array of filter option items
      required:
      - data
      - hasMore
      type: object
      additionalProperties: true
    FilterOptionsQueryParams:
      description: 'Raw query parameters for filter options endpoint — these are what tsoa parses

        from the HTTP request. `filters` is a URL-encoded JSON string at this level;

        the service transforms it into `FilterGroupDto` via `transformQueryDto`.'
      properties:
        filters:
          type: string
          description: 'Recursive AND/OR filter group. Send as a URL-encoded JSON string.


            Example (decoded):

            ```

            {"and":[{"filter":{"key":"severity","op":"equals","value":"high"}}]}

            ```'
        offset:
          type: number
          format: double
          description: Zero-based offset for pagination
          default: '0'
          minimum: 0
        limit:
          type: number
          format: double
          description: Maximum number of options to return per page
          default: '20'
          minimum: 1
          maximum: 100
        search:
          type: string
          description: Search term to filter options by (case-insensitive partial match)
      type: object
      additionalProperties: true
    EdgeIndices:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    GetIndicesResponse:
      items:
        $ref: '#/components/schemas/EdgeIndices'
      type: array
    SurveyDomain:
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
      required:
      - name
      - id
      type: object
    GetSurveysResponse:
      properties:
        rows:
          items:
            $ref: '#/components/schemas/SurveyDomain'
          type: array
        rows_available:
          type: number
          format: double
        page_size:
          type: number
          format: double
        start_row:
          type: number
          format: double
        end_row:
          type: number
          format: double
      required:
      - end_row
      - start_row
      - page_size
      - rows_available
      - rows
      type: object
    ServiceNowConfigStatus:
      properties:
        status:
          type: string
      required:
      - status
      type: object
      additionalProperties: true
    ServiceNowFieldDefinition:
      properties:
        name:
          type: string
        dependent:
          type: string
        dependent_on_field:
          type: string
        reference:
          type: string
        choice:
          type: string
        internal_type:
          type: string
        column_label:
          type: string
        element:
          type: string
      required:
      - element
      - column_label
      - internal_type
      type: object
      additionalProperties: true
    ServiceNowFieldOption:
      properties:
        category:
          type: string
        dependent_value:
          type: string
        name:
          type: string
        label:
          type: string
        value:
          type: string
      required:
      - value
      - label
      type: object
      additionalProperties: true
    PaginatedServiceNowFieldOptions:
      description: Paginated options envelope returned by the Edge DX API when `paginated=true`.
      properties:
        hasMore:
          type: boolean
        limit:
          type: number
          format: double
        offset:
          type: number
          format: double
        total:
          type: number
          format: double
        result:
          items:
            $ref: '#/components/schemas/ServiceNowFieldOption'
          type: array
      required:
      - result
      - total
      - offset
      - limit
      - hasMore
      type: object
      additionalProperties: true
    ServiceNowPageLimit:
      type: integer
      format: int32
      description: A non-negative integer page size for paginated ServiceNow field options.
      minimum: 1
    ServiceNowPageOffset:
      type: integer
      format: int32
      description: A non-negative integer page offset for paginated ServiceNow field options.
      minimum: 0
    SyncDesktopAlertsResponse:
      properties:
        upserted:
          type: number
          format: double
        alreadyMigrated:
          type: boolean
      required:
      - alreadyMigrated
      - upserted
      type: object
    GetMigrationStatusResponse:
      properties:
        migrated:
          type: boolean
        migratedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - migratedAt
      - migrated
      type: object
    EdgeMetrics:
      properties:
        name:
          type: string
        type:
          type: string
      required:
      - type
      - name
      type: object
    GetMetricsResponse:
      items:
        $ref: '#/components/schemas/EdgeMetrics'
      type: array
    GetScriptsResponse:
      properties:
        _id:
          type: string
        _created:
          type: string
        _updated:
          type: string
        root_id:
          type: string
        _created_by_user_id:
          type: string
        _created_by_username:
          type: string
        _updated_by_user_id:
          type: string
        _updated_by_username:
          type: string
        version:
          type: number
          format: double
        hash:
          type: string
        hash_256:
          type: string
        enabled:
          type: boolean
        name:
          type: string
        description:
          type: string
        level:
          type: string
        cu_product:
          type: number
          format: double
        language:
          type: number
          format: double
        platform:
          type: number
          format: double
        trigger:
          type: number
          format: double
        trigger_meta:
          type: string
        timeout:
          type: number
          format: double
        run_online_only:
          type: boolean
        run_idle_only:
          type: boolean
        sends_data:
          type: boolean
        data_index:
          type: string
        overwrite_existing_data:
          type: boolean
        builtin_script:
          type: boolean
      required:
      - builtin_script
      - overwrite_existing_data
      - data_index
      - sends_data
      - run_idle_only
      - run_online_only
      - timeout
      - trigger_meta
      - trigger
      - platform
      - language
      - cu_product
      - level
      - description
      - name
      - enabled
      - hash_256
      - hash
      - version
      - _updated_by_username
      - _updated_by_user_id
      - _created_by_username
      - _created_by_user_id
      - root_id
      - _updated
      - _created
      - _id
      type: object
    ScriptsType:
      enum:
      - user
      - system
      type: string
    DesktopPlatform:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      type: number
    DesktopAlertMetricCondition:
      type: string
      enum:
      - '='
      - '!='
      - '>='
      - '>'
      - <=
      - <
      - like
    DesktopAlertMetric:
      properties:
        metric:
          type: string
          description: 'The name of the metric (field) to use for the condition.

            You must enter the name of the field as it appears in the data index.'
        condition:
          $ref: '#/components/schemas/DesktopAlertMetricCondition'
          description: Type of comparison. Note that a condition based on a string field must use the `like` condition.
        value:
          type: string
          description: Value to compare against. Numbers can be passed as strings.
      required:
      - value
      - condition
      - metric
      type: object
    Email:
      type: string
      format: email
      description: Valid email address.
      pattern: ^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$
    URI:
      type: string
      example: http://example.com
      format: uri
      description: Valid URI.
      pattern: ^(http(s)?:\/\/.)?(www\.)?([-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6})|(localhost)\b([-a-zA-Z0-9@:%_\+.~#?&\/=]*)$
    ServiceNowTicketType:
      enum:
      - 1
      - 2
      type: number
    ServiceNowCustomFields:
      description: Custom fields dictionary type for ServiceNow integration.
      properties: {}
      type: object
      additionalProperties:
        type: string
    DesktopAlertConfigDTO:
      properties:
        integrations:
          properties:
            servicenow:
              properties:
                customFields:
                  $ref: '#/components/schemas/ServiceNowCustomFields'
                subcategory:
                  type: string
                category:
                  type: string
                closeNotes:
                  type: string
                closeCode:
                  type: string
                settings:
                  properties:
                    autoUpdateTicketState:
                      type: string
                    eventMapping:
                      properties:
                        resource:
                          type: string
                        node:
                          type: string
                        alertDescription:
                          type: string
                      type: object
                  type: object
                eventSource:
                  type: string
                eventType:
                  type: string
                autoResolveIntervalSeconds:
                  type: number
                  format: double
                  description: 'The duration, in seconds, the system waits after an alert condition has cleared before automatically
                    resolving the associated ServiceNow ticket.

                    If omitted, the ticket does not automatically resolve.'
                urgency:
                  type: integer
                  format: int32
                  description: Urgency level of the ServiceNow ticket.
                impact:
                  type: integer
                  format: int32
                  description: Impact level of the ServiceNow ticket.
                ticketType:
                  $ref: '#/components/schemas/ServiceNowTicketType'
                  description: Type of ServiceNow ticket created. (1 - Incident, 2 - Event)
                enabled:
                  type: boolean
                  description: Whether the ServiceNow integration is enabled.
              required:
              - urgency
              - impact
              - ticketType
              - enabled
              type: object
              description: ServiceNow integration configuration.
          type: object
          description: Integrations with third-party software.
        selfServiceNotification:
          properties:
            scriptLabel:
              type: string
              nullable: true
              description: Custom label for the "Run Script" button shown in the Connect / self-service notification. If empty,
                a default label is used.
            scriptId:
              type: string
              nullable: true
              description: ID of a system script offered to the end user through the ControlUp Connect notification. Independent
                from `actions.systemScriptId`.
            message:
              type: string
              nullable: true
              description: Custom message displayed to the end user when the self-service notification triggers.
            enabled:
              type: boolean
              description: Whether to trigger a self-service notification on the end user's device when the alert fires.
          required:
          - enabled
          type: object
          description: ControlUp Connect / end-user self-service notification settings.
        tags:
          items:
            type: string
          type: array
          description: 'List of device tags to filter which devices can trigger this alert.

            If empty or omitted, the alert applies to all devices.

            If set, the alert triggers only for devices that have at least one matching tag.'
        notifications:
          properties:
            webhookUrl:
              allOf:
              - $ref: '#/components/schemas/URI'
              nullable: true
              description: Destination URL to receive a notification when the alert triggers. Set to null to clear.
            emailAddresses:
              items:
                $ref: '#/components/schemas/Email'
              type: array
              description: A list of email addresses to receive a notification when the alert triggers.
          type: object
          description: Notifications to send when the alert triggers.
        actions:
          properties:
            surveyId:
              type: string
              description: ID of an on-demand survey to run. You can use [List all surveys](get-surveys) to get survey IDs.
            userScriptId:
              type: string
              description: 'ID of a user script to run. You can use [List all scripts](list-all-scripts) to get script IDs.

                The script must match the platform in the `platform` parameter.'
            systemScriptId:
              type: string
              description: 'ID of a system script to run. You can use [List all scripts](list-all-scripts) to get script IDs.

                The script must match the platform in the `platform` parameter.'
          type: object
          description: Followup actions to run on devices that trigger the alert.
        retriggerIntervalSeconds:
          type: number
          format: double
          description: 'The minimum duration between subsequent alert activations.

            If the retrigger interval duration has not passed since the last alert activation, then the alert won''t activate
            even if all conditions are met.'
        hitsTimeWindowSeconds:
          type: number
          format: double
          description: The time window in seconds for the `hitsNumber` parameter.
        hitsNumber:
          type: number
          format: double
          description: The number of times that the alert conditions (`metrics`) must be met within the specified time window
            (hitsTimeWindowSeconds) for the alert to trigger.
        metrics:
          items:
            $ref: '#/components/schemas/DesktopAlertMetric'
          type: array
          description: List of conditions that must be met for the alert to trigger. Multiple conditions are combined with
