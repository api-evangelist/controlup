    MachineAggregatedResult:
      type: object
      description: Aggregated machine statistics row. The exact set of fields returned depends on the requested groupBy, metrics
        and aggregations. Each request returns the group field, machine_count, and one column per <metric>_<aggregation> combination.
      properties:
        machine_count:
          type: integer
          format: int64
          description: Number of distinct machines in the group (COUNT(DISTINCT computer_id)). Always returned.
        folder_path:
          type: string
          description: Folder path the machine belonged to. Present when groupBy=folderPath.
        folder_id:
          type: integer
          format: int64
          description: 'Folder identifier. Present when groupBy=folderId. Numeric: folder ids fit within the safe integer
            range, so they are not affected by the large-id precision issue (bug #310813).'
        operating_system:
          type: string
          description: Operating system name. Present when groupBy=operatingSystem.
        hypervisor_platform:
          type: string
          description: Hypervisor platform (VMware, Hyper-V, Nutanix, ...). Present when groupBy=hypervisorPlatform.
        az_region:
          type: string
          description: Azure region. Present when groupBy=azRegion.
        az_vm_size:
          type: string
          description: Azure VM size/SKU. Present when groupBy=azVmSize.
        gpu_architecture:
          type: string
          description: GPU architecture. Present when groupBy=gpuArchitecture.
        gpu_model:
          type: string
          description: GPU model. Present when groupBy=gpuModel.
