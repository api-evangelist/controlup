  /v1/sessions:
    get:
      tags:
      - Session
      summary: Get session statistics
      description: Returns statistics for all user sessions. Visit the <a href='https://support.controlup.com/docs/user-sessions-activity-report'
        target='_blank'>Session Activity Report</a> documentation for column descriptions and more details.
      operationId: getSessionsStatistics
      parameters:
      - name: presetType
        in: query
        description: Set the type of statistics to return for each user session.
        required: true
        schema:
          type: string
          enum:
          - activity
          - client
          - cvad
          - horizon
          - resources
          - ux
          - list
      - name: userAccount
        in: query
        description: Filter sessions by user account, provided in the Domain\username format.
        required: false
        schema:
          type: string
      - name: userName
        in: query
        description: Filter sessions by user display name (partial match, e.g. 'John Doe'). If both userName and userAccount
          are provided, userAccount takes precedence.
        required: false
        schema:
          type: string
        example: John Doe
      - name: serverName
        in: query
        description: Filter sessions by server name. This parameter is only applicable when the preset is set to LIST.
        required: false
        schema:
          type: string
      - name: _timeFrom
        in: query
        description: 'Start date and time of the search period in the format: YYYY-MM-DD''T''hh:mm:ss.sssZ'
        required: true
        schema:
          type: string
          format: date-time
        example: '2025-02-01T00:00:00.000Z'
      - name: _timeTo
        in: query
        description: 'End date and time of the search period in the format: YYYY-MM-DD''T''hh:mm:ss.sssZ'
        required: true
        schema:
          type: string
          format: date-time
        example: '2025-02-02T00:00:00.000Z'
      - name: logonDurationgt
        in: query
        description: Minimum logon duration in seconds
        required: false
        schema:
          type: integer
          format: int32
      - name: logonDurationlt
        in: query
        description: Maximum logon duration in seconds
        required: false
        schema:
          type: integer
          format: int32
      - name: _page
        in: query
        description: The page number returned. The first page is 1.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      - name: _limit
        in: query
        description: The number of items returned per page. Minimum is 1.
        schema:
          type: integer
