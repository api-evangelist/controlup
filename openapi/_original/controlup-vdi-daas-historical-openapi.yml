  /v1/applications/statistics:
    get:
      tags:
      - Applications
      summary: Get application statistics
      description: Returns usage details and resource consumption statistics for all applications (per version number). Statistics
        are aggregated either weekly (Monday-Sunday) or monthly, depending on the timeFrame parameter. Visit the <a href='https://support.controlup.com/docs/application-statistics-report'
        target='_blank'>App Statistics Report</a> documentation for column descriptions and more details.
      operationId: getAppStats
      parameters:
      - name: timeFrame
        in: query
        description: Aggregate statistics either weekly (Monday-Sunday) or monthly.
        required: true
        schema:
          type: string
          description: Aggregate statistics either weekly (Monday-Sunday) or monthly.
          enum:
          - 1W
          - 1M
      - name: datetime
        in: query
        description: Return statistics around the specified date and time. If timeFrame is set to 1W (1 week), then the endpoint
          returns statistics for the week (Monday-Sunday) that the date is within. If timeFrame is set to 1M (1 month), then
          the endpoint returns statistics for the month that the date is within. For example, if the specified date and time
          is on Saturday the 6th and timeFrame = 1W, then the endpoint returns aggregated statistics from Monday the 1st to
          Sunday the 7th.
        required: true
        schema:
          type: string
        example: '2025-02-01T00:00:00.000Z'
      - name: folderPath
        in: query
        description: Limits the scope of the returned application statistics to machines located under the specified full
          folder path within the ControlUp VDI organizational tree. Path must start with the root organization name (e.g.,
          controlup\hq\financevdi)
        required: false
        schema:
          type: string
      - name: _page
        in: query
        description: The page number returned. The first page is 1.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      - name: _limit
        in: query
        description: The number of items returned per page. Minimum is 1.
        schema:
          type: integer
          format: int32
          maximum: 100000
          minimum: 1
        example: 20
      responses:
        '200':
          description: Successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStatsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/AppStatsResponse'
