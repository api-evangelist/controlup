openapi: 3.1.0
info:
  title: VDI & DAAS API
  version: 1.0.0
servers:
- url: https://api.controlup.com/historical
security:
- bearer-jwt:
  - read
  - write
tags:
- name: Dynamic Query API
  description: Dynamic SQL transformation and execution
- name: Host
  description: Host usage reports
- name: User
  description: User activity reports
- name: WindowsEvents
  description: Windows Event Log Monitoring history
- name: Machine
  description: Machine usage reports
- name: NetScaler
  description: Netscaler usage reports
- name: Support endpoint
  description: Provides an additional information about customer's data
- name: Processes
  description: Process usage reports
- name: Session
  description: Session statistics report
- name: Applications
  description: Applications usage reports
paths:
  /v1/dynamic-query/execute:
    post:
      tags:
      - Dynamic Query API
      summary: Transform and Execute SQL Query
      description: Parse, validate, transform, and execute a SQL query, ensuring the result conforms to the expected structure
        and can be run safely.
      operationId: execute
      requestBody:
        description: SQL SELECT statement with date range and pagination parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlQuery'
        required: true
      responses:
        '200':
          description: SQL transformed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '400':
          description: Bad Request - one of the inputs isn't correct
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
        '401':
          description: User is not authorized to access the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
        '403':
          description: Authorization details are not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
        '501':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
        '504':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
  /v2/netscaler/usage/system:
    get:
      tags:
      - NetScaler
      summary: Get NetScaler metrics with time series
      description: Returns performance metrics for each NetScaler appliance. Visit the <a href='https://support.controlup.com/docs/citrix-netscaler-adc-report'
        target='_blank'>NetScaler Report</a> documentation for column descriptions and more details.
      operationId: getNetscalerUsageWithTimeSeries
      parameters:
      - name: name
        in: query
        description: Only return metrics for the specified NetScaler name.
        required: false
        schema:
          type: string
      - name: _timeFrom
        in: query
        description: 'Start date and time of the search period in the format: YYYY-MM-DD''T''hh:mm:ss.sssZ'
        required: true
        schema:
          type: string
          format: date-time
        example: '2025-02-01T00:00:00.000Z'
      - name: _timeTo
        in: query
        description: 'End date and time of the search period in the format: YYYY-MM-DD''T''hh:mm:ss.sssZ'
        required: true
        schema:
          type: string
          format: date-time
        example: '2025-02-02T00:00:00.000Z'
      - name: _page
        in: query
        description: The page number returned. The first page is 1.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      - name: _limit
        in: query
        description: The number of items returned per page. Minimum is 1.
        schema:
          type: integer
          format: int32
          maximum: 100000
          minimum: 1
        example: 20
      responses:
        '200':
          description: Successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetscalerTimeSeriesResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/NetscalerTimeSeriesResponse'
        '400':
          description: Bad Request - one of the inputs isn't correct
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
        '401':
          description: User is not authorized to access the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
        '403':
          description: Authorization details are not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/HistoricalErrorResponse'
        '501':
          description: Internal Server Error
          content:
