      operationId: getRecommendationAzure
      parameters:
      - name: license
        in: query
        description: Your license type for Microsoft Windows Virtual Machines. If you have Azure Hybrid Benefit, enter ‘Azure
          Hybrid Benefit’. If you purchase a new license for each machine, enter ‘OS (Windows)’.
        required: true
        schema:
          type: string
          enum:
          - Azure Hybrid Benefit
          - OS (Windows)
        example: Azure Hybrid Benefit
      - name: azureRegion
        in: query
        description: The Azure region where you want to see representative costs. You must provide the name of the region
          as it appears in the report creation UI.
        required: true
        schema:
          type: string
      - name: currency
        in: query
        description: The currency used for all cost information in the report.
        required: false
        schema:
          type: string
          default: USD
          enum:
          - USD
          - EUR
          - GBP
        example: USD
      - name: msEaDiscountRatePct
        in: query
        description: The discount rate percentage due to a Microsoft Enterprise Agreement. If you don’t have a discount rate,
          enter `0`.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 100
          minimum: 0
        example: 0
      - name: acceleratedNetworking
        in: query
        description: Select whether you require VMs with or without Accelerated Networking. Enter `any` if you have no preference.
        required: false
        schema:
          type: string
          default: Any
          enum:
          - Any
          - 'True'
          - 'False'
        example: Any
      - name: memoryPreservingMaintenance
        in: query
        description: Select whether you require VMs with or without Memory Preserving Maintenance. Enter `any` if you have
          no preference.
        required: false
        schema:
          type: string
