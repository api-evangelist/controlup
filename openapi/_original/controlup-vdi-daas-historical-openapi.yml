  /v1/users/activity:
    get:
      tags:
      - User
      summary: Get user activity status
      description: Returns a list of users and their activity status throughout the search period. The search period is divided
        into smaller time windows according to the granularity parameter. The endpoint returns a user's activity status for
        each time window.
      operationId: getUserActivity
      parameters:
      - name: userAccount
        in: query
        description: Only return activity data for the specified user account (user_account).
        required: false
        schema:
          type: string
      - name: granularity
        in: query
        description: Sets the length of the time windows in which a user activity statuses are returned. For example, if you
          set this to 5m then you can see a user's activity status for each 5 minute interval throughout the search period.
        required: true
        schema:
          type: string
          description: Sets the length of the time windows in which a user activity statuses are returned. For example, if
            you set this to 5m then you can see a user's activity status for each 5 minute interval throughout the search
            period.
          enum:
          - 1h
          - 5m
      - name: _timeFrom
        in: query
        description: 'Start date and time of the search period in the format: YYYY-MM-DD''T''hh:mm:ss.sssZ'
        required: true
        schema:
          type: string
          format: date-time
        example: '2025-02-01T00:00:00.000Z'
      - name: _timeTo
        in: query
        description: 'End date and time of the search period in the format: YYYY-MM-DD''T''hh:mm:ss.sssZ'
        required: true
        schema:
          type: string
          format: date-time
        example: '2025-02-02T00:00:00.000Z'
      - name: _page
        in: query
        description: The page number returned. The first page is 1.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      - name: _limit
        in: query
        description: The number of items returned per page. Minimum is 1.
        schema:
          type: integer
          format: int32
          maximum: 100000
          minimum: 1
        example: 20
      responses:
        '200':
          description: Successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalListResponseUserActivityResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/HistoricalListResponseUserActivityResult'
        '400':
          description: Bad Request - one of the inputs isn't correct
