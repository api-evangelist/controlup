  /v1/sessions/aggregated:
    get:
      tags:
      - Session
      summary: Get aggregated session activity
      description: Returns aggregated session activity metrics (avg/min/max/count) grouped by a single session dimension such
        as folder, delivery group, site, user, protocol, or initial program. Visit the <a href='https://support.controlup.com/docs/user-sessions-activity-report'
        target='_blank'>Session Activity Report</a> documentation for column descriptions and more details.
      operationId: getSessionsAggregated
      parameters:
      - name: groupBy
        in: query
        description: Single session dimension to group rows by.
        required: true
        schema:
          type: string
          enum:
          - folderPath
          - folderId
          - deliveryGroup
          - deliveryGroupId
          - eucSiteName
          - eucSiteId
          - cvadSiteName
          - horizonSite
          - userAccount
          - userFullName
          - protocol
          - initialProgram
      - name: metrics
        in: query
        description: One or more session metrics to aggregate. Repeat the parameter for multiple values.
        required: true
        schema:
          type: array
          items:
            type: string
            enum:
            - duration_in_seconds
            - logon_duration
            - profile_load_time
            - desktop_load_time
            - group_policy_load_time
            - logon_duration_other
            - cvad_logon_duration
            - cvad_profile_load_time
            - cvad_group_policy_load_time
            - session_protocol_latency_avg
            - session_protocol_latency_max
            - session_protocol_latency_min
            - rtt_avg
            - rtt_max
            - rtt_min
            - active_time_in_seconds
            - idle_time_in_seconds
            - disconnected_time_in_seconds
      - name: aggregations
        in: query
        description: 'Aggregation functions to apply to each metric. Repeat for multiple. Default: avg.'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - avg
            - min
            - max
            - count
      - name: _sortBy
        in: query
        description: 'Response field to sort by (must equal a returned <metric>_<aggregation>, session_count, or the groupBy
          field). Default: <first metric>_<first aggregation>.'
        required: false
        schema:
          type: string
      - name: _sortOrder
        in: query
        description: 'Sort order. Default: desc.'
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: _timeFrom
        in: query
        description: 'Start date and time of the search period in the format: YYYY-MM-DD''T''hh:mm:ss.sssZ'
        required: true
        schema:
          type: string
          format: date-time
        example: '2025-02-01T00:00:00.000Z'
      - name: _timeTo
        in: query
        description: 'End date and time of the search period in the format: YYYY-MM-DD''T''hh:mm:ss.sssZ'
        required: true
        schema:
          type: string
          format: date-time
        example: '2025-02-02T00:00:00.000Z'
      - name: userAccount
        in: query
        description: Filter sessions by user account, provided in the Domain\username format.
        required: false
        schema:
          type: string
      - name: serverName
        in: query
        description: Filter sessions by server name.
        required: false
        schema:
          type: string
      - name: logonDurationgt
        in: query
        description: Minimum logon duration in seconds (pre-aggregation filter).
        required: false
        schema:
          type: integer
          format: int32
      - name: logonDurationlt
        in: query
        description: Maximum logon duration in seconds (pre-aggregation filter).
        required: false
        schema:
          type: integer
          format: int32
      - name: _page
        in: query
        description: The page number returned. The first page is 1.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      - name: _limit
        in: query
        description: The number of items returned per page. Minimum is 1.
        schema:
          type: integer
          format: int32
          maximum: 100000
          minimum: 1
        example: 20
      responses:
        '200':
          description: Successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAggregatedResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SessionAggregatedResponse'
        '400':
          description: Bad Request - one of the inputs isn't correct
