    SessionAggregatedResult:
      type: object
      description: Aggregated session activity row. The exact set of fields returned depends on the requested groupBy, metrics
        and aggregations. Each request returns the group field, session_count, and one column per <metric>_<aggregation> combination.
      properties:
        session_count:
          type: integer
          format: int64
          description: Number of distinct sessions in the group (COUNT(DISTINCT session_uid)). Always returned.
        folder_path:
          type: string
          description: Folder path the session belonged to. Present when groupBy=folderPath.
        folder_id:
          type: integer
          format: int64
          description: 'Folder identifier. Present when groupBy=folderId. Numeric: folder ids fit within the 32-bit range,
            so they are not affected by the large-id precision issue (bug #310813).'
        initial_cvad_delivery_group:
          type: string
          description: CVAD delivery group display name. Present when groupBy=deliveryGroup. CVAD-only.
        initial_cvad_delivery_group_id:
          type: string
          description: 'CVAD delivery group identifier. Present when groupBy=deliveryGroupId. CVAD-only. Returned as a string:
