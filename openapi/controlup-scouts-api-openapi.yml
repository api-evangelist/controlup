            - 1
            - 2
            - 3
            - 5
            - 10
            - 15
            - 30
            - 60
    WebTransactionsExtras:
      title: Web Transactions options
      description: Additional options for the Web Transactions Scout.
      type: object
      properties:
        sslVerify:
          type: boolean
          description: Whether the Scout validates the SSL certificate of the target site. Set to false to test sites with private or self-signed certificates.
          default: true
        successCode:
          type: array
          description: A list of the HTTP response codes that the Scout considers successful.
          default:
          - 2xx
          items:
            type: string
            enum:
            - 1xx
            - 2xx
            - 4xx
            - 5xx
        windowType:
          type: string
          description: Preset window form factor. Mutually exclusive with `windowSize`.
          enum:
          - desktop
          - mobile
        windowSize:
          type: object
          description: Explicit browser window dimensions. Mutually exclusive with `windowType`.
          properties:
            height:
              type: integer
              minimum: 0
              maximum: 4000
            width:
              type: integer
              minimum: 0
              maximum: 4000
        transactionTimeout:
          type: integer
          description: The maximum runtime allowed for the entire transaction (in seconds).
          minimum: 30
          maximum: 180
          default: 30
    ScoutCreateTraceroute:
      title: Traceroute
      allOf:
      - $ref: '#/components/schemas/HostnameAndIp'
      - $ref: '#/components/schemas/Hives'
      - type: object
        properties:
          subType:
            type: string
            description: The Scout's sub-type. This indicates the type of network test the Scout performs.
            enum:
            - net_traceroute
          options:
            $ref: '#/components/schemas/TracerouteExtras'
    HttpExtras:
      type: object
      title: HTTP options
      description: Additional options.
      properties:
        method:
          description: The HTTP method.
          type: string
          enum:
          - GET
          - POST
          default: GET
        requestBody:
          description: Data sent in the request body. The HTTP `method` must be set to "POST" to send request body data. The data can be in any format (for example, json or string).
          type: string
        timeout:
          description: The maximum wait time for the request (in seconds).
          type: number
          format: float
          minimum: 0.001
          maximum: 30
          default: 10
        sslVerify:
          description: Whether the Scout needs to validate the SSL certificate of the website. If true, the test will fail if the certificate isn't trusted. If false, you will be able to test websites with private or self-signed certificates.
          type: boolean
          default: false
        pattern:
          description: A string that the Scout will look for in the response. If not found, the test will fail.
          type: string
        maxRedirects:
          description: The maximum number of redirects to follow before the test fails.
          type: integer
          default: 10
        successCode:
          description: A list of the HTTP response codes that the Scout will consider successful.
          type: array
          default:
          - 2xx
          items:
            type: string
            enum:
            - 1xx
            - 2xx
            - 3xx
            - 4xx
            - 5xx
        headers:
          description: A list of headers to send in the HTTP request.
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Header name.
              value:
                type: string
                description: Header value.
        auth:
          description: Authentication information for accessing the website.
          allOf:
          - $ref: '#/components/schemas/HttpAuth'
          - required:
            - type
            - username
            - password
        proxy:
          allOf:
          - $ref: '#/components/schemas/HttpProxy'
          - required:
            - type
            - address
    MsTeamsExtras:
      title: Microsoft Teams options
      description: Additional options for the Microsoft Teams Scout.
      type: object
      properties:
        relayAddress:
          type: string
          description: The Teams media relay address (hostname or IP) probed by the Scout.
        edgeAddress:
          type: string
          format: url
          description: The Teams edge URL probed by the Scout. Must use HTTPS.
        allowedLoss:
          type: number
          format: float
          description: The maximum tolerated packet loss percentage before the test fails.
          minimum: 0
          maximum: 100
          default: 0
        failureCondition:
          type: string
          description: How the Scout decides the test failed when more than one probe is configured.
          enum:
          - all
          - one_of_them
          default: one_of_them
    ScoutCreateDNS:
