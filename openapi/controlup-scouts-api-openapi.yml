        type: object
        properties:
          cloudHive:
            type: integer
            format: int32
            description: ID of the Cloud Hive from which the Scout will run.
      - title: Custom Hive
        type: object
        properties:
          hiveId:
            type: integer
            format: int32
            description: ID of the Custom Hive from which the Scout will run.
    PingExtras:
      title: Ping options
      description: Additional options.
      oneOf:
      - $ref: '#/components/schemas/ProtocolICMP'
      - $ref: '#/components/schemas/Protocols'
      type: object
      properties:
        count:
          type: integer
          description: The number of packets sent during the test. Jitter can be measured if there is more than one packet.
          minimum: 1
          maximum: 10
          default: 4
        successfulPercentage:
          type: integer
          enum:
          - 20
          - 40
          - 60
          - 80
          - 100
          description: The percentage of packets that must be received for the test to be successful.
        timeout:
          description: The maximum response wait time (in seconds).
          type: number
          format: float
          minimum: 0.001
          maximum: 3.6
          default: 1
        maxttl:
          description: The maximum time to live (TTL) in ms.
          type: integer
          minimum: 1
          maximum: 255
          default: 64
