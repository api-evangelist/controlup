          sessionReadyMax:
            type: number
            format: float
            description: Maximum time for the session to be ready in seconds.
          sessionReadyMedian:
            type: number
            format: float
            description: Median time for the session to be ready in seconds.
          sessionReady95Percentile:
            type: number
            format: float
            description: 95th percentile of the time for the session to be ready in seconds.
          authPhaseAvg:
            type: number
            format: float
            description: Average authentication time in seconds.
          enumTimeAvg:
            type: number
            format: float
            description: Average enumeration time in seconds.
          icaTimeAvg:
            type: number
            format: float
            description: Average ICA download time in seconds.
          connPhaseAvg:
            type: number
            format: float
            description: Average connection time in seconds.
          initAvg:
            type: number
            format: float
            description: Average session initialization time in seconds.
          readyAvg:
            type: number
            format: float
            description: Average session handoff (ready) duration in seconds.
      - title: Network Scout
        oneOf:
        - type: object
          title: Ping
          properties:
            avgRttAvg:
              type: number
              format: float
              description: Average response time in ms.
            avgRttMax:
              type: number
              format: float
              description: Maximum response time in ms.
            avgRttMedian:
              type: number
              format: float
              description: Median response time in ms.
            avgRtt95Percentile:
              type: number
              format: float
              description: 95th percentile of the response time in ms.
            jitterAvg:
              type: number
              format: float
              description: Average jitter in ms.
        - type: object
          title: DNS
          properties:
            runtimeAvg:
              type: number
              format: float
              description: Average response time in ms.
            runtimeMax:
              type: number
              format: float
              description: Maximum response time in ms.
            runtimeMedian:
              type: number
              format: float
              description: Median response time in ms.
            runtime95Percentile:
              type: number
              format: float
              description: 95th percentile of the response time in ms.
        - type: object
          title: Traceroute
          properties:
            avgRttAvg:
              type: number
              format: float
              description: Average response time in ms.
            avgRttMax:
              type: number
              format: float
              description: Maximum response time in ms.
            avgRttMedian:
              type: number
              format: float
              description: Median response time in ms.
            avgRtt95Percentile:
              type: number
              format: float
              description: 95th percentile the response time in ms.
        - type: object
          title: HTTP/S
          properties:
            latencyAvg:
              type: number
              format: float
              description: Average latency in ms.
            latencyMax:
              type: number
              format: float
              description: Maximum latency in ms.
            latencyMedian:
              type: number
              format: float
              description: Median latency in ms.
            latency95Percentile:
              type: number
              format: float
              description: 95th percentile of the latency in ms.
            namelookupTimeAvg:
              type: number
              format: float
              description: Average name lookup time in ms.
            connectTimeAvg:
              type: number
              format: float
              description: Average connection time in ms.
            tlsHandshakeTimeAvg:
              type: number
              format: float
              description: Average TLS handshake time in ms.
            responseTimeAvg:
              type: number
              format: float
              description: Average response time in ms.
            ttfbAvg:
              type: number
              format: float
              description: Average time to first byte in ms.
            redirectTimeAvg:
              type: number
              format: float
              description: Average redirect time in ms.
        - type: object
          title: Shell
          properties:
            runtimeAvg:
              type: number
              format: float
              description: Average shell command execution duration in ms.
            runtimeMax:
              type: number
              format: float
              description: Maximum shell command execution duration in ms.
            runtimeMedian:
              type: number
              format: float
              description: Median shell command execution duration in ms.
            runtime95Percentile:
              type: number
              format: float
              description: 95th percentile of the shell command execution duration in ms.
        - type: object
          title: Entra ID
          properties:
            userQueryDurationAvg:
              type: number
              format: float
              description: Average duration of the user lookup query against Entra ID, in ms.
            userQueryDurationMax:
              type: number
              format: float
              description: Maximum duration of the user lookup query against Entra ID, in ms.
            userQueryDurationMedian:
              type: number
              format: float
              description: Median duration of the user lookup query against Entra ID, in ms.
            userQueryDuration95Percentile:
              type: number
              format: float
              description: 95th percentile of the user lookup query duration, in ms.
            queryDurationAvg:
              type: number
              format: float
              description: Average duration of the directory query against Entra ID, in ms.
      - title: Application Scout
        oneOf:
        - type: object
          title: Siteload
          properties:
            durationAvg:
              type: number
              format: float
              description: Average page load duration in ms.
            durationMax:
              type: number
              format: float
              description: Maximum page load duration in ms.
            durationMedian:
              type: number
              format: float
              description: Median page load duration in ms.
            duration95Percentile:
              type: number
              format: float
              description: 95th percentile of the page load duration in ms.
            ttfbAvg:
              type: number
              format: float
              description: Average time to first byte in ms.
            firstPaintAvg:
              type: number
              format: float
              description: Average time until the first paint event in ms.
            contentfulPaintAvg:
              type: number
              format: float
              description: Average time until the first contentful paint event in ms.
            domCompleteAvg:
              type: number
              format: float
              description: Average time until the DOM reached the complete state in ms.
        - type: object
          title: Microsoft Teams
          properties:
            avgLatencyAvg:
              type: number
              format: float
              description: Average round-trip latency to the Teams relay in ms.
            avgLatencyMax:
              type: number
              format: float
              description: Maximum round-trip latency to the Teams relay in ms.
            avgLatencyMedian:
              type: number
              format: float
              description: Median round-trip latency to the Teams relay in ms.
            avgLatency95Percentile:
              type: number
              format: float
              description: 95th percentile of the round-trip latency in ms.
            avgJitterAvg:
              type: number
              format: float
              description: Average jitter observed during the media test in ms.
            packetsLossAvg:
              type: number
              format: float
              description: Average packet loss ratio across tests, as a percentage.
            httpLatencyAvg:
              type: number
              format: float
              description: Average total time to receive the HTTP signaling response in ms.
        - type: object
          title: Web Transactions
          properties:
            totalDurationAvg:
              type: number
              format: float
              description: Average total transaction duration including all steps in ms.
            totalDurationMax:
              type: number
              format: float
              description: Maximum total transaction duration in ms.
            totalDurationMedian:
              type: number
              format: float
              description: Median total transaction duration in ms.
            totalDuration95Percentile:
              type: number
              format: float
              description: 95th percentile of the total transaction duration in ms.
            stepsDurationAvg:
              type: number
              format: float
              description: Average cumulative duration of the user-defined steps after the initial page load, in ms.
        - type: object
          title: Mail
          properties:
            deliveryDurationAvg:
              type: number
              format: float
              description: Average end-to-end mail delivery duration in ms.
            deliveryDurationMax:
              type: number
              format: float
              description: Maximum end-to-end mail delivery duration in ms.
            deliveryDurationMedian:
              type: number
              format: float
              description: Median end-to-end mail delivery duration in ms.
            deliveryDuration95Percentile:
              type: number
              format: float
              description: 95th percentile of the end-to-end mail delivery duration in ms.
            emailServerProcessDurationAvg:
              type: number
              format: float
              description: Average time spent processing on the customer email server, in ms.
            clientToEmailServerDurationAvg:
              type: number
              format: float
              description: Average duration from client send to the customer email server, in ms.
            emailServerToDestinationDurationAvg:
              type: number
              format: float
              description: Average duration from the customer email server to the destination mailbox, in ms.
            deliveryDurationToEmailServerAvg:
              type: number
              format: float
              description: Average delivery duration up to the customer email server, in ms.
    ScoutCreateNet:
      title: Network Scout
      oneOf:
      - $ref: '#/components/schemas/ScoutCreatePing'
      - $ref: '#/components/schemas/ScoutCreateDNS'
      - $ref: '#/components/schemas/ScoutCreateTraceroute'
      - $ref: '#/components/schemas/ScoutCreateHttp'
      - $ref: '#/components/schemas/ScoutCreateShell'
      - $ref: '#/components/schemas/ScoutCreateEntraId'
      allOf:
      - type: object
        properties:
          scoutName:
            type: string
            description: The Scout's name.
          interval:
            type: integer
            description: The interval (in minutes) of how often the Scout runs.
            enum:
            - 1
            - 2
            - 3
            - 5
            - 10
            - 15
            - 30
            - 60
      required:
      - scoutName
      - interval
      - address
      - subType
      - hives
    ScoutCreateAvd:
      title: Azure Virtual Desktop
      allOf:
      - $ref: '#/components/schemas/CloudOrCustomHive'
      - type: object
        properties:
          subType:
            type: string
            description: The Scout's sub-type. This indicates the EUC platform that the Scout accesses.
            enum:
            - avd
          address:
            type: string
            description: Optional gateway address. For AVD the resource itself identifies the target, so this field is allowed to be omitted.
            nullable: true
          otp:
            $ref: '#/components/schemas/OTP'
    ScoutCreateSiteload:
      title: Siteload
      description: Loads the target page in a real browser and measures key page-load metrics.
      allOf:
      - $ref: '#/components/schemas/Hives'
      - type: object
        properties:
          subType:
            type: string
            description: The Scout's sub-type.
            enum:
            - siteload
          address:
            type: string
            format: url
            description: The URL the Scout loads.
          options:
            $ref: '#/components/schemas/SiteloadExtras'
        required:
        - address
    MailExtras:
      title: Mail options
      description: Additional options for the Mail Scout. Mail authenticates exclusively via the user-delegated OAuth flow against Microsoft Entra ID — pass the delegated access token in the top-level `password` field. The application-credentials flow (client_id + client_secret) used by `entra_id` Scouts is **not** supported for `mail`.
      type: object
      properties:
        subType:
          type: string
          description: Direction of the mail-flow test performed by the Scout. `outgoing` sends mail from the authenticated mailbox to a Scoutbees-managed recipient; `incoming` does the reverse. Sender, recipient, and mail-service endpoints are managed by Scoutbees based on this direction and cannot be overridden via the API.
          enum:
          - incoming
          - outgoing
        authentication:
          type: string
          description: The authentication flow used to acquire a token against the mail service. Only `oauth` is supported for mail.
          enum:
          - oauth
        timeout:
          type: number
          format: float
          description: The maximum wait time for a single mail probe (in seconds).
          minimum: 30
          maximum: 180
          default: 30
      required:
      - subType
      - authentication
    ScoutCreateEntraId:
      title: Entra ID
      description: Tests connectivity and authentication against a Microsoft Entra ID (Azure AD) tenant.
      allOf:
      - $ref: '#/components/schemas/Hives'
      - type: object
        properties:
          subType:
            type: string
            description: The Scout's sub-type.
            enum:
            - entra_id
          address:
            type: string
            description: The Entra ID tenant ID the Scout authenticates against.
          username:
            type: string
            description: Email of the user the Scout authenticates as.
            maxLength: 100
          password:
            type: object
            description: Authentication credentials. For `application` auth, supply `clientId` and `clientSecret`. For `oauth` auth, supply the OAuth token data returned by the consent flow.
            writeOnly: true
          options:
            $ref: '#/components/schemas/EntraIdExtras'
        required:
        - address
        - password
    ScoutCreateVmwareSecServer:
      title: VMware Security Server
      allOf:
      - $ref: '#/components/schemas/ScoutCreateEucDomain'
      - $ref: '#/components/schemas/CloudOrCustomHive'
      - type: object
        properties:
          subType:
            type: string
            description: The Scout's sub-type. This indicates the EUC platform that the Scout accesses.
            enum:
            - vmware_secsrv
          otp:
            $ref: '#/components/schemas/OTP'
    ScoutCreateCitrix:
      title: Citrix Virtual Apps and Desktops - NetScaler Gateway
      allOf:
      - $ref: '#/components/schemas/CloudOrCustomHive'
      - type: object
        properties:
          subType:
            type: string
            description: The Scout's sub-type. This indicates the EUC platform that the Scout accesses.
            enum:
            - citrix_gateway
          otp:
            $ref: '#/components/schemas/OTP'
    ScoutEditMsExchange:
      title: Microsoft Exchange
      allOf:
      - $ref: '#/components/schemas/Hives'
      - type: object
        properties: {}
    ScoutCreateWebTransactions:
      title: Web Transactions
      description: Drives a real browser through a list of steps and reports timing and navigation metrics for each step.
      allOf:
      - $ref: '#/components/schemas/Hives'
      - type: object
        properties:
          subType:
            type: string
            description: The Scout's sub-type.
            enum:
            - web_transactions
          address:
            type: string
            format: url
            description: The starting URL for the transaction flow.
          transactionFlows:
            type: array
            description: Ordered list of steps the Scout executes against the target site.
            items:
              $ref: '#/components/schemas/WebTransactionFlow'
          otp:
            $ref: '#/components/schemas/OTP'
          options:
            $ref: '#/components/schemas/WebTransactionsExtras'
        required:
        - address
        - transactionFlows
    DNSExtras:
      title: DNS options
      description: Additional options.
      type: object
      properties:
        queryType:
          type: string
          description: The DNS query type. "A" indicates an address record. "MX" indicates a mail exchange record.
          enum:
          - A
          - MX
          default: A
        servers:
          type: array
          description: DNS server used for the query.
          items:
            type: string
            format: ipv4
        expectedResult:
          description: The IP address that the Scout expects for the result of the DNS query. If the query returns a different IP address, then the test fails.
          type: string
          maxLength: 1024
        timeout:
          description: The maximum response wait time (in seconds).
          type: number
          format: float
          minimum: 0.001
          maximum: 5
          default: 0.005
    ScoutItemEuc:
      type: object
      title: EUC Scouts
      properties:
        hives:
          type: object
          description: ID of the Cloud or Custom Hive that runs the Scout. EUC Scouts can only run from a single Hive.
          oneOf:
          - type: object
            title: Cloud Hive
            properties:
              cloud:
                type: array
                description: Cloud Hive ID.
                items:
                  type: integer
                  format: int32
          - type: object
            title: Custom Hive
            properties:
              custom:
                type: array
                description: Custom Hive ID.
                items:
                  type: integer
                  format: int32
        type:
          type: string
          description: The Scout's type.
          enum:
          - euc
        subType:
          type: string
          description: The Scout's sub-type.
          enum:
          - citrix_gateway
          - citrix_cloud
          - citrix_storefront
          - vmware_horizon
          - vmware_w1
          - vmware_secsrv
          - avd
        address:
          type: string
          description: The address of the gateway that the Scout accesses.
        username:
          type: string
          description: The username the Scout uses to access the gateway.
        resource:
          type: string
          description: The resource the Scout accesses and tests.
        domain:
          type: string
          description: The domain the Scout uses to access the gateway, if one exists.
        otp:
          $ref: '#/components/schemas/OTP'
        options:
          $ref: '#/components/schemas/EucExtras'
        children:
          type: array
          description: Child Scouts that make up the parent Scout's checks. Present for Citrix and VMware parent Scouts, which probe the route to the gateway with a network traceroute.
          items:
            type: object
            properties:
              scoutId:
                type: integer
                description: ID of the child Scout.
              scoutName:
                type: string
                description: The child Scout's name.
              subType:
                type: string
                description: The child Scout's sub-type.
                enum:
                - net_traceroute
              address:
                type: string
                description: The hostname or URL the child Scout accesses.
              options:
                type: object
                description: Additional options for the child Scout.
              summary:
                $ref: '#/components/schemas/ScoutSummary'
    ShellExtras:
      title: Shell options
      description: Additional options for the Shell Scout. The Scout runs the executable named in `address` on the host where its Custom Hive is installed.
      type: object
      properties:
        args:
          type: string
          description: Command-line arguments passed to the executable.
        env:
          type: object
          description: Environment variables to set when running the executable.
          additionalProperties:
            type: string
        workingDir:
          type: string
          description: Working directory in which the executable runs.
        errorCode:
          type: array
          description: Exit-code ranges that the Scout considers successful. Each item is `[min, max]` inclusive.
          default:
          - - 0
            - 0
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: integer
        timeout:
          type: number
          format: float
          description: The maximum execution time (in seconds).
          minimum: 0.1
          maximum: 180
          default: 30
        pattern:
          type: string
          description: A string the Scout looks for in stdout. The test fails if it isn't found.
          maxLength: 1024
        stdin:
          type: string
          description: Data piped to the executable's stdin.
          maxLength: 2048
    ScoutEditEuc:
      title: Edit EUC Scout
      type: object
      properties:
        address:
          type: string
          format: url
          description: The address of the gateway that the Scout accesses.
        scoutName:
          type: string
          description: The Scout's name.
        interval:
          type: integer
          description: The interval (in minutes) of how often the Scout runs.
          enum:
          - 5
          - 10
          - 15
          - 30
          - 60
        resource:
          type: string
          description: The published resource that the Scout accesses and tests.
        username:
          type: string
          description: The username used to access the gateway.
        password:
