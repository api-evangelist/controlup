  requestBodies:
    ScoutEdit:
      description: Edit scout
      required: true
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ScoutEditEuc'
            - $ref: '#/components/schemas/ScoutEditNet'
            - $ref: '#/components/schemas/ScoutEditApp'
            allOf:
            - type: object
              properties:
                tags:
                  description: "A list of tag value UUIDs to associate with the Scout.\n\nTag values can be retrieved from [GET /v1/organizations/{orgId}/tags](orgtagspubliccontroller_getall).\nEach tag object contains a list of values, each with its own `id`. To assign a tag, provide the `id` of the desired tag value.\n\n**Example:** Given the following tag object:\n```json\n{\n  \"id\": \"047b0a09-a33e-45fd-b579-a098ec60d0b5\",\n  \"key\": \"Database\",\n  \"values\": [\n    { \"id\": \"07725341-3335-4f4a-a6d7-f64302546c7e\", \"label\": \"SQL\", \"color\": \"stone\" },\n    { \"id\": \"2e7aa044-6786-406d-bd00-f43921831099\", \"label\": \"NoSQL\", \"color\": \"stone\" }\n  ]\n}\n```\nTo assign the Database:SQL tag, include `\"07725341-3335-4f4a-a6d7-f64302546c7e\"` in the list.\n\nWhen you update tags, all existing tags are replaced with the ones you provide.\n"
                  type: array
                  items:
                    type: string
                    format: uuid
                    description: The UUID of a tag value.
    ScoutCreate:
      description: Select the Scout's type, sub-type, and hive type (if applicable), to see the relevant parameters.
      required: true
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ScoutCreateEuc'
            - $ref: '#/components/schemas/ScoutCreateNet'
            - $ref: '#/components/schemas/ScoutCreateApp'
            allOf:
            - type: object
              properties:
                tags:
                  description: "A list of tag value UUIDs to associate with the Scout.\n\nTag values can be retrieved from [GET /v1/organizations/{orgId}/tags](orgtagspubliccontroller_getall). \nEach tag object contains a list of values, each with its own `id`. To assign a tag, provide the `id` of the desired tag value.\n\n**Example:** Given the following tag object:\n```json\n{\n  \"id\": \"047b0a09-a33e-45fd-b579-a098ec60d0b5\",\n  \"key\": \"Database\",\n  \"values\": [\n    { \"id\": \"07725341-3335-4f4a-a6d7-f64302546c7e\", \"label\": \"SQL\", \"color\": \"stone\" },\n    { \"id\": \"2e7aa044-6786-406d-bd00-f43921831099\", \"label\": \"NoSQL\", \"color\": \"stone\" }\n  ]\n}\n```\nTo assign the Database:SQL tag, include `\"07725341-3335-4f4a-a6d7-f64302546c7e\"` in the list.\n\nWhen you update tags, all existing tags are replaced with the ones you provide.\n"
                  type: array
                  items:
                    type: string
