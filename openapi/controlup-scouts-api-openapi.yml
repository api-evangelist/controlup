          subType:
            type: string
            description: The Scout's sub-type.
            enum:
            - shell
          address:
            type: string
            description: The executable the Scout runs on the host where its Custom Hive is installed.
          options:
            $ref: '#/components/schemas/ShellExtras'
        required:
        - hives
        - address
    ScoutCreateApp:
