        properties:
          address:
            type: string
            format: url
            description: The Teams edge URL probed by the Scout.
            maxLength: 1000
          options:
            $ref: '#/components/schemas/MsTeamsExtras'
    ScoutEditDNS:
      title: DNS
      allOf:
      - $ref: '#/components/schemas/Hostname'
