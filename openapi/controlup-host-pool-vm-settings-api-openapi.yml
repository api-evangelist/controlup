      - subscription
      - resourceGroup
      - workspace
      - image
      - gallery
      - galleryImage
      - galleryImageVersion
      - hostPool
      - virtualMachine
      - virtualNetwork
      type: string
      description: 'Public API enum for resource types that users can discover/import.

        Only includes high-level resource types exposed to end users.'
    RegionMetadataDto:
