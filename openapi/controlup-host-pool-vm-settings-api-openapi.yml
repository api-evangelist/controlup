components:
  schemas:
    VmSizeDto:
      required:
      - cores
      - displayName
      - isRestricted
      - localStorageBytes
      - maxDataDisks
      - memoryBytes
      - name
      - osDiskSizeBytes
      - size
      - supportsAcceleratedNetworking
      - supportsDiskControllerNVMe
      - supportsDiskControllerSCSI
      - supportsEphemeralOSDisk
      - supportsHyperVGenerationV1
      - supportsHyperVGenerationV2
      - supportsPremiumStorage
      - supportsTrustedLaunch
      type: object
      properties:
        name:
          type: string
          description: VM size name (e.g., "Standard_D2s_v3", "Standard_B2ms").
        displayName:
          type: string
          description: 'Display name combining tier and size (e.g., "Standard D2s_v3", "Basic A1").

            User-friendly formatted name for UI presentation.'
        tier:
          type:
          - string
          - 'null'
          description: VM size tier (e.g., "Basic", "Standard").
        size:
          type: string
          description: 'Size identifier without the tier prefix (e.g., "D2s_v3", "B2ms").

            Useful for grouping VM sizes by family/series.'
        cores:
          type: integer
          description: Number of virtual CPU cores.
          format: int32
        memoryBytes:
          type: integer
          description: Memory size in bytes.
          format: int64
        maxDataDisks:
          type: integer
          description: Maximum number of data disks that can be attached.
          format: int32
        osDiskSizeBytes:
          type: integer
          description: OS disk size in bytes.
          format: int64
        localStorageBytes:
          type: integer
          description: Temporary/local storage size in bytes.
          format: int64
        family:
          type:
          - string
          - 'null'
          description: 'VM family/series (e.g., "standardDSv3Family", "standardBSFamily").

            Matches ControlUp.Foundry.Api.Dtos.Cloud.ComputeQuotaDto.Name from the compute-quota endpoint

            to check whether the subscription has enough cores available for this VM size.'
        maxIops:
          type:
          - integer
          - 'null'
          description: Maximum IOPS for the VM.
          format: int64
        maxNetworkInterfaces:
          type:
          - integer
          - 'null'
          description: Maximum number of network interfaces (NICs).
          format: int32
        supportsPremiumStorage:
          type: boolean
          description: Whether the VM size supports premium storage (SSD).
        supportsAcceleratedNetworking:
          type: boolean
          description: Whether the VM size supports accelerated networking.
        supportsEphemeralOSDisk:
          type: boolean
          description: Whether the VM size supports ephemeral OS disks.
        supportsTrustedLaunch:
          type: boolean
          description: 'Whether this VM size supports Trusted Launch deployments.

            Derived from the Azure Resource SKU `TrustedLaunchDisabled` capability (inverted: absent or false means supported).

            Not related to gallery/managed image `securityType` (Standard / TrustedLaunch / ConfidentialVM), which describes the image definition.

            Filterable: use `filter=eq(supportsTrustedLaunch,true)` to get only Trusted-Launch-capable sizes.'
        availableZones:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'List of availability zone numbers where this VM size is available in the region.

            Example: ["1", "2", "3"] for regions with 3 availability zones.

            Null if the region doesn''t support availability zones or zone information is unavailable.

            Not all VM sizes are available in all zones - check this field for zone-specific deployment planning.'
        hyperVGenerations:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Hyper-V generations supported by this VM size.

            Example: ["V1", "V2"] for sizes that support both generations, ["V2"] for Gen2-only sizes.

            Null when generation metadata is unavailable.

            Use this to filter VM sizes by the source image''s HyperV generation

            (e.g., only show V2-capable sizes when deploying a Gen2 gallery image).'
        diskControllerTypes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Disk controller types supported by this VM size.

            Example: ["SCSI", "NVMe"] for sizes that support both controllers, ["NVMe"] for NVMe-only sizes.

            Defaults to ["SCSI"] when the Azure SKU omits the capability.

            Use this to filter VM sizes by the source image''s disk controller requirement.'
        cpuArchitectureType:
          type:
          - string
          - 'null'
          description: 'CPU architecture type supported by this VM size (e.g., "x64", "Arm64").

            Sourced from the Azure Resource SKU CpuArchitectureType capability.

            Null when the capability is absent.'
        supportsHyperVGenerationV1:
          type: boolean
          description: 'Whether this VM size supports Hyper-V Generation 1 images.

            Derived from ControlUp.Foundry.Api.Dtos.Cloud.VmSizeDto.HyperVGenerations; false when generation metadata is unavailable.

            Filterable: use `filter=eq(supportsHyperVGenerationV1,true)` to get only V1-compatible sizes.'
        supportsHyperVGenerationV2:
          type: boolean
          description: 'Whether this VM size supports Hyper-V Generation 2 images.

            Derived from ControlUp.Foundry.Api.Dtos.Cloud.VmSizeDto.HyperVGenerations; false when generation metadata is unavailable.

            Filterable: use `filter=eq(supportsHyperVGenerationV2,true)` to get only V2-compatible sizes.'
        supportsDiskControllerSCSI:
          type: boolean
          description: 'Whether this VM size supports SCSI disk controller images.

            Derived from ControlUp.Foundry.Api.Dtos.Cloud.VmSizeDto.DiskControllerTypes; false when metadata is unavailable.

            Filterable: use `filter=eq(supportsDiskControllerSCSI,true)` to get only SCSI-compatible sizes.'
        supportsDiskControllerNVMe:
          type: boolean
          description: 'Whether this VM size supports NVMe disk controller images.

            Derived from ControlUp.Foundry.Api.Dtos.Cloud.VmSizeDto.DiskControllerTypes; false when metadata is unavailable.

            Filterable: use `filter=eq(supportsDiskControllerNVMe,true)` to get only NVMe-compatible sizes.'
        isRestricted:
          type: boolean
          description: 'Whether this VM size is restricted for the current subscription in this region.

            True when Azure reports a subscription-level restriction (NotAvailableForSubscription),

            meaning the SKU is not enabled for this subscription regardless of capacity.

            Restricted sizes will fail deployment even though they appear in the catalog.'
      additionalProperties: false
      description: 'Data transfer object representing a virtual machine size/SKU.

        Contains specifications and capabilities for capacity planning and provisioning.'
    VmSecurityType:
      enum:
      - trustedLaunch
      - standard
      - confidentialVM
      type: string
      description: Security profile for Azure VMs.
    HostPoolVmImageSource:
      enum:
      - gallery
      - existingVm
      type: string
      description: Image source selection for host pool VM settings.
    HostPoolVmNetworkSecurityGroup:
      enum:
      - basic
