          format: uuid
        masterImageVersionId:
          type: string
          description: Master Image version identifier.
          format: uuid
        masterImageName:
          type: string
          description: Master Image display name.
        versionName:
          type: string
          description: Version name.
        resources:
          type: array
          items:
            $ref: '#/components/schemas/MasterImageDecommissionResourceDto'
          description: Temporary publish artifacts Foundry can clean up.
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal warnings encountered while building the plan.
      additionalProperties: false
      description: Master Image publish artifact cleanup plan response.
    MasterImageVersionDtoPagedResultDto:
      required:
      - count
      - hasMore
      - items
      - page
      - pageSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MasterImageVersionDto'
          description: The items in the current page.
        page:
          type: integer
          description: Current page number (1-based).
          format: int32
        pageSize:
          type: integer
          description: Number of items per page.
          format: int32
        count:
          type: integer
          description: 'Actual number of items returned in this page.

            May be less than PageSize on the last page.'
          format: int32
        hasMore:
          type: boolean
          description: 'Indicates if more pages are available.

            True if Count equals PageSize, suggesting more data exists.'
        totalCount:
          type:
          - integer
          - 'null'
          description: 'Total count of items across all pages (if available).

            May be null if the data source does not support total count queries.'
          format: int32
