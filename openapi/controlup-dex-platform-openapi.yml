    get:
      operationId: OrgLicensePublicController_getLicenseUsage
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_LicenseUsageOverTimeResponse_'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody_ErrorType_BadRequestErrorMessages.HttpStatusCode.BAD_REQUEST.BadRequestErrorCodes__'
        '401':
          description: 'Unauthorized: Access is denied'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody_ErrorType_ErrorMessage.Unauthorized.HttpStatusCode.UNAUTHORIZED.ErrorCode.Unauthorized__'
        '403':
          description: 'Forbidden: Access to this resource is denied'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody_ErrorType_ErrorMessage.Forbidden.HttpStatusCode.FORBIDDEN.ErrorCode.Forbidden__'
        '404':
          description: 'Not Found: The requested resource could not be found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody_ErrorType_ErrorMessage.NotFound.HttpStatusCode.NOT_FOUND.ErrorCode.NotFound__'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody_ErrorType_ErrorMessage.InternalServerError.HttpStatusCode.INTERNAL_SERVER_ERROR.ErrorCode.InternalServerError__'
      description: 'Returns license usage data for your organization over a specified time range.

        For managed organizations, returns usage for that organization.

        For MSP organizations, returns aggregated usage across all managed organizations.'
      summary: Retrieve license usage in time range
      tags:
      - License Usage
      security:
      - apiKey: []
      parameters:
      - description: ID of your ControlUp organization. You can find your organization ID on the [API Key Management page](how-to-make-api-requests#how-to-find-your-controlup-organization-id)
          in the DEX platform.
        in: path
        name: orgId
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - description: Start date and time for the usage data range in ISO string format (UTC).
        in: query
        name: timeFrom
        required: true
        schema:
          $ref: '#/components/schemas/ISOString'
        style: form
      - description: End date and time for the usage data range in ISO string format (UTC).
        in: query
        name: timeTo
        required: true
        schema:
          $ref: '#/components/schemas/ISOString'
        style: form
      - description: Array of organization IDs to filter the usage data by.
        in: query
        name: childOrgsIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/NonEmptyString'
        example:
        - 123e4567-e89b-12d3-a456-426614174000
        - 987fcdeb-1234-5678-9abc-111111111111
        style: form
  /organizations/{tenantManagerOrgId}/tenants:
