    UUID:
      type: string
      format: uuid
      description: 'Stringified UUIDv4.

        See [RFC 4112](https://tools.ietf.org/html/rfc4122)'
      pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
    ISOString:
      type: string
      example: '2022-12-22T18:43:55.483Z'
      format: ISO String YYYY-MM-DDTHH:mm:ss.sssZ
      description: Valid ISO string
      pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.\d{3})?Z$
    AuditLogQueryParams:
      properties:
        _timeTo:
          $ref: '#/components/schemas/ISOString'
          description: Return events up to the specified date and time in ISO string format (UTC).
          example: '2022-12-22T18:43:55.483Z'
        _timeFrom:
          $ref: '#/components/schemas/ISOString'
          description: 'Return events starting from the specified date and time in ISO string format (UTC).

            If you don’t provide a value, then the default is 24 hours in the past from the time of the request.'
          example: '2022-12-22T18:43:55.483Z'
        origin:
          items:
            $ref: '#/components/schemas/EventOrigin'
          type: array
          description: A search filter on the `origin` field.
        status:
          items:
            $ref: '#/components/schemas/StatusType'
          type: array
          description: A search filter on the `status` field.
        ip:
          items:
            type: string
          type: array
          description: A search filter on the `ip` field.
        module:
          items:
            $ref: '#/components/schemas/ModulePublic'
          type: array
          description: A search filter on the `module` field.
        source:
          items:
            type: string
          type: array
          description: A search filter on the `source` field.
        type:
          items:
            $ref: '#/components/schemas/ActionType'
          type: array
          description: A search filter on the `type` field.
        description:
          items:
            type: string
          type: array
          description: A search filter on the `description` field.
        activity:
          items:
            type: string
          type: array
          description: A search filter on the `activity` field.
        _format:
          type: string
          enum:
          - json
          - xml
          - csv
          description: The format of returned results.
          example: json
          default: json
        _search:
          type: string
          description: 'A search filter that is applied to all fields.

            Only results that contain the specified string are returned.'
        _order:
          type: string
          enum:
          - asc
          - desc
          description: The sort order (ascending / descending) of the field specified by the `_sortBy` parameter.
          example: desc
          default: desc
        _sortBy:
          type: string
          enum:
          - activity
          - description
          - type
          - time
          - source
          - module
          - ip
          - status
          - origin
          nullable: false
          description: Sorts results according to the specified field.
          example: time
          default: time
        _limit:
          type: integer
          format: int32
          description: The number of results returned per page.
          example: 10
          default: '10'
          minimum: 1
        _page:
          type: integer
          format: int32
          description: 'The page of results to return.

            The first page is page number 1.'
          example: 1
          default: '1'
          minimum: 1
      type: object
      additionalProperties: true
    InvitationResults:
      properties:
        invitedUsers:
          items:
            type: string
          type: array
          description: A list of email addresses of users who were successfully invited.
        uninvitedUsers:
          items:
            properties:
              errorCode:
                type: number
                format: double
                description: The specific error code for the invitation failure.
              reason:
                type: string
                description: The reason the user was not successfully invited.
              email:
                type: string
                description: The user’s email address.
            required:
            - reason
            - email
            type: object
          type: array
          description: A list of email addresses of users who were not invited.
      type: object
      example:
        invitedUsers:
        - test1@controlup.com
        - test2@controlup.com
        uninvitedUsers:
        - email: test3@controlup.com
          reason: 'user cannot be invited - user is competitors'' domain - email: test3@controlup.com'
        - email: test4@controlup.com
          reason: user cannot be invited - user already related to org
