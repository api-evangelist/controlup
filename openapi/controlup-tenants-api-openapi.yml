  /cloud/tenants/{tenantId}/resources/import:
    post:
      tags:
      - Tenants
      summary: Import cloud resources for a tenant
      description: "Creates a single long-running parent job that orchestrates subscription-level import jobs.\nThe parent job discovers subscriptions, dispatches child import jobs (one per subscription),\naggregates progress, and determines overall success/failure.\n            \nTwo modes are supported:\n1. **Import All**: Set `importAll: true` to discover all subscriptions and import all resources\n2. **Selective Import**: Provide specific subscriptions and resource IDs to import\n            \nSelective imports default to reconcile behavior: subscriptions and resources omitted from the request\nare soft-deleted. Set `importMode` to `Additive` for host-pool-only imports that must preserve\nall existing managed resources.\n            \nWhen importing, CloudSubscription records are automatically created for Azure subscriptions\nthat don't exist yet in the system. These subscriptions are linked to the tenant and use\nthe tenant's default credentials."
      operationId: ImportTenantResources
      parameters:
      - name: tenantId
        in: path
        description: The unique tenant identifier.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: The import request specifying what to import.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportTenantResourcesRequest'
        required: true
      responses:
        '201':
          description: Import job created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreatedDto'
              example:
                id: a1b2c3d4-5678-90ab-cdef-1234567890ab
                jobType: cloudResourceImport
                action: Cloud Resource Import
                jobUrl: https://api.example.com/api/v1/jobs/a1b2c3d4-5678-90ab-cdef-1234567890ab
                statusUrl: https://api.example.com/api/v1/jobs/a1b2c3d4-5678-90ab-cdef-1234567890ab/status
