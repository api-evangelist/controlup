      description: "Returns the tenant's aggregated health and verification details, computed from every credential and subscription beneath it.\nReads the last stored result without contacting the cloud provider, so it is fast and safe to call repeatedly,\nbut reflects the previous evaluation rather than this moment; a never-evaluated tenant reports Unknown.\nUse this to display known health. To re-test connectivity right now, refresh the status instead.\n            \nUse the `include` parameter to request additional details:\n- `subscriptions` - Include status for each subscription under the tenant\n- `credentials` - Include detailed status (health, cooldown, usage metrics) for each credential\n            \nMultiple values can be combined with commas: `include=subscriptions,credentials`"
      operationId: GetTenantStatus
      parameters:
      - name: id
        in: path
        description: The unique tenant identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        description: Comma-separated list of additional data to include (subscriptions, credentials).
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the tenant status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTenantStatusDto'
        '400':
          description: Bad request. Invalid tenant ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment required. No active license for the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. User does not have permission to view tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found. The specified tenant does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable. License status could not be verified. Try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
  /cloud/tenants/{id}/status/refresh:
    post:
      tags:
      - Tenants
      summary: Refresh tenant status
      description: "Re-tests the tenant against the cloud provider now, verifying every subscription beneath it and re-aggregating\nthe result, then stores it so later reads of the tenant status return this outcome.\nThe authoritative answer to \"is this tenant working right now\", at the cost of live provider calls across\nevery subscription. Covers the whole tenant, whereas verifying a credential tests one credential in isolation.\n            \nUse the `include` parameter to request additional details:\n- `subscriptions` - Include status for each subscription under the tenant\n- `credentials` - Include detailed status (health, cooldown, usage metrics) for each credential\n            \nMultiple values can be combined with commas: `include=subscriptions,credentials`"
      operationId: RefreshTenantStatus
      parameters:
      - name: id
        in: path
        description: The unique tenant identifier.
        required: true
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        description: Comma-separated list of additional data to include (subscriptions, credentials).
        schema:
          type: string
      responses:
        '200':
          description: Successfully refreshed the tenant status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTenantStatusDto'
        '400':
          description: Bad request. Invalid tenant ID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment required. No active license for the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. User does not have permission to view tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found. The specified tenant does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable. License status could not be verified. Try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
components:
  schemas:
    PatchCloudTenantRequest:
      type: object
      properties:
        name:
          maxLength: 64
          minLength: 3
          type:
          - string
          - 'null'
          description: User-friendly name for the tenant.
        defaultCredential:
          $ref: '#/components/schemas/PatchCloudCredentialRequest'
      additionalProperties: false
      description: 'Request model for patching (partial update) a cloud tenant.

        All fields are optional - only provided fields will be updated.'
    TenantLifecycleState:
      enum:
      - draft
      - active
      - deleting
      - deleted
      type: string
      description: 'Lifecycle state of a cloud tenant.

        Represents the tenant''s position in the management workflow.'
    UpdateCloudTenantRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 1
          type: string
          description: User-friendly name for the tenant.
        defaultCredential:
          $ref: '#/components/schemas/UpdateCloudCredentialRequest'
      additionalProperties: false
      description: 'Request model for updating a cloud tenant.

        Allows updating tenant name and optionally replacing the default credential.'
    VerificationTranscriptResponse:
      required:
      - isSuccess
      - output
      type: object
      properties:
        isSuccess:
          type: boolean
          description: Whether the operation was successful.
          example: true
        output:
          type: array
          items:
            type: string
          description: Formatted output lines from the operation.
      additionalProperties: false
      description: 'Generic response for operations that produce formatted line-by-line output.

        Can be used for validations, diagnostics, migrations, deployments, or any operation

        that provides step-by-step progress or results as text output.'
    CloudProvider:
      enum:
      - azure
      type: string
      description: Enumeration of supported cloud provider identifiers.
    VmSecurityType:
      enum:
      - trustedLaunch
      - standard
      - confidentialVM
      type: string
      description: Security profile for Azure VMs.
    VerificationResponse:
      required:
      - completedAt
      - durationMs
      - isSuccess
      - steps
      type: object
      properties:
        isSuccess:
          type: boolean
          description: 'Whether the overall verification was successful.

            All steps must succeed for this to be true.'
          example: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/VerificationStepResponse'
          description: 'List of verification steps and their individual results.

            Each step represents a specific check performed against the cloud provider API.'
        errorMessage:
          type:
          - string
          - 'null'
          description: 'Overall error message if the verification failed.

            Typically contains the error from the first failed step.'
          example: 'Authentication failed: Invalid client secret'
        completedAt:
          type: string
          description: Timestamp when the verification completed (UTC).
          format: date-time
          example: '2025-10-09T14:30:00Z'
        durationMs:
          type: integer
          description: Total duration of the verification process in milliseconds.
          format: int64
          example: 950
      additionalProperties: false
      description: 'Response containing detailed results of a credential verification operation.

        Includes overall success status, individual step results, and timing information.'
    CloudProviderAuthType:
      enum:
      - azureServicePrincipal
      - azureServicePrincipalCertificate
      type: string
      description: Specifies the supported authentication types for connecting to various cloud providers and services.
    JobType:
      enum:
      - cloudResourceImport
      - inventorySync
      - metricCollection
      - costCollection
      - budgetCollection
      - sessionStateCollection
      - sessionHostAction
      - cloudResourceAction
      - cloudCredentialVerification
      - cloudTenantResourceImport
      - masterImageDeploy
      - masterImagePublish
      - masterImageSync
      - masterImageCleanup
      - masterImageVersionDelete
      - masterImagePublishCleanup
      - licenseUsageReport
      - hostPoolOrphanedResourcesCleanup
      - hostPoolCreate
      - hostPoolSessionHostCreate
      - hostPoolSessionHostBatchCreate
      - hostPoolDelete
      type: string
      description: 'Defines the types of background jobs supported by the system.

        Each job type is processed by a specific worker and has its own parameter structure.'
    VerificationStatus:
      enum:
      - notChecked
      - inProgress
      - success
      - warning
      - failed
      type: string
      description: Represents the status of a verification check (credentials, inventory sync, etc.).
    DiscoveredHostPoolDto:
      required:
      - hostPoolType
      - id
      - isAlreadyManaged
      - location
      - name
      - resourceGroup
      - subscriptionId
      - tags
      - type
      type: object
      properties:
        id:
          type: string
          description: 'Cloud provider resource identifier.

            For Azure, this is the fully qualified resource ID.'
        subscriptionId:
          type: string
          description: Cloud provider subscription ID containing this entity.
        name:
          type: string
          description: User-friendly entity name.
        type:
          $ref: '#/components/schemas/DiscoverableResourceType'
        location:
          type: string
          description: Geographic location or region where the entity is deployed.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Gets a collection of tags associated with the entity.
        resourceGroup:
          type: string
          description: Resource group name containing this resource.
        isAlreadyManaged:
          type: boolean
          description: Whether this resource is already managed by the application
          example: false
        hostPoolType:
          $ref: '#/components/schemas/HostPoolType'
      additionalProperties: false
      description: 'Represents a discovered Azure Virtual Desktop host pool.

        Extends the base CloudResourceDto with host pool-specific properties.'
    ImportTenantResourcesRequest:
      type: object
      properties:
        importAll:
          type: boolean
          description: 'Whether to import ALL resources from ALL subscriptions under the tenant.

            When true, the system will:

            1. Discover all Azure subscriptions accessible with tenant credentials

            2. Create CloudSubscription records for any that don''t exist

            3. Import all resources (HostPools, Images, etc.) from each subscription

            When false, only resources specified in the Subscriptions collection will be imported.'
          default: false
        importMode:
          $ref: '#/components/schemas/ResourceImportMode'
        subscriptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TenantSubscriptionImportDto'
          description: 'Subscriptions and their resources to import (used when ImportAll is false).

            Each item specifies an Azure subscription and the resources to import from it.'
      additionalProperties: false
      description: 'Request model for importing cloud resources at the tenant level.

        Supports two modes:

        1. Import ALL resources from ALL subscriptions under the tenant (importAll = true)

        2. Import specific resources grouped by subscription (subscriptions collection)'
    ErrorResponse:
      required:
      - status
      - title
      - traceId
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
          format: int32
        detail:
          type:
          - string
          - 'null'
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type:
          - string
          - 'null'
          description: A URI reference that identifies the specific occurrence of the problem.
        errors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Dictionary of field-specific validation errors (only present for validation failures).

            Key is the field name, value is an array of error messages for that field.'
        traceId:
          type: string
          description: Request ID (cu-request-id) for tracking and debugging purposes.
      additionalProperties: false
      description: 'Standard error body the API returns when a request fails validation or cannot be completed.

        Follows RFC 7807 Problem Details with additional `errors` and `traceId` fields.'
    TenantSubscriptionStatusDto:
      required:
      - credentialsVerificationStatus
      - id
      - inventorySyncStatus
      - name
      - status
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the subscription.
          format: uuid
        name:
          type: string
          description: Display name of the subscription.
        providerSubscriptionId:
          type:
          - string
          - 'null'
          description: External subscription ID from the cloud provider.
        status:
          $ref: '#/components/schemas/SubscriptionHealthStatus'
        statusMessage:
          type:
          - string
          - 'null'
          description: Human-readable message describing the current status.
        credentialsVerificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        lastCredentialsVerificationAt:
          type:
          - string
          - 'null'
          description: Timestamp of the last credentials verification attempt.
          format: date-time
        lastSuccessfulCredentialsVerificationAt:
          type:
          - string
          - 'null'
          description: Timestamp of the last successful credentials verification.
          format: date-time
        credentialsVerificationStatusMessage:
          type:
          - string
          - 'null'
          description: Status message from the last credentials verification.
        inventorySyncStatus:
          $ref: '#/components/schemas/VerificationStatus'
        lastInventorySyncAttemptAt:
          type:
          - string
          - 'null'
          description: Timestamp of the last inventory sync attempt.
          format: date-time
        lastSuccessfulInventorySyncAt:
          type:
          - string
          - 'null'
          description: Timestamp of the last successful inventory sync.
          format: date-time
        inventorySyncStatusMessage:
          type:
          - string
          - 'null'
          description: Status message from the last inventory sync.
      additionalProperties: false
      description: 'Subscription status details within a tenant status response.

        Includes subscription identity and full status information.'
    DiscoverableResourceType:
      enum:
      - subscription
      - resourceGroup
      - workspace
      - image
      - gallery
      - galleryImage
      - galleryImageVersion
      - hostPool
      - virtualMachine
      - virtualNetwork
      type: string
      description: 'Public API enum for resource types that users can discover/import.

        Only includes high-level resource types exposed to end users.'
    DiscoveredImageDtoPagedResultDto:
      required:
      - count
      - hasMore
      - items
      - page
      - pageSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredImageDto'
          description: The items in the current page.
        page:
          type: integer
          description: Current page number (1-based).
          format: int32
        pageSize:
          type: integer
          description: Number of items per page.
          format: int32
        count:
          type: integer
          description: 'Actual number of items returned in this page.

            May be less than PageSize on the last page.'
          format: int32
        hasMore:
          type: boolean
          description: 'Indicates if more pages are available.

            True if Count equals PageSize, suggesting more data exists.'
        totalCount:
          type:
          - integer
          - 'null'
          description: 'Total count of items across all pages (if available).

            May be null if the data source does not support total count queries.'
          format: int32
      additionalProperties: false
      description: 'Generic paginated response wrapper for API endpoints.

        Supports traditional page-based navigation with forward/backward capability.'
    DiscoveredSubscriptionDtoPagedResultDto:
      required:
      - count
      - hasMore
      - items
      - page
      - pageSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredSubscriptionDto'
          description: The items in the current page.
        page:
          type: integer
          description: Current page number (1-based).
          format: int32
        pageSize:
          type: integer
          description: Number of items per page.
          format: int32
        count:
          type: integer
          description: 'Actual number of items returned in this page.

            May be less than PageSize on the last page.'
          format: int32
        hasMore:
          type: boolean
          description: 'Indicates if more pages are available.

            True if Count equals PageSize, suggesting more data exists.'
        totalCount:
          type:
          - integer
          - 'null'
          description: 'Total count of items across all pages (if available).

            May be null if the data source does not support total count queries.'
          format: int32
      additionalProperties: false
      description: 'Generic paginated response wrapper for API endpoints.

        Supports traditional page-based navigation with forward/backward capability.'
    UpdateCloudCredentialRequest:
      required:
      - authType
      - credentials
      type: object
      properties:
        authType:
          $ref: '#/components/schemas/CloudProviderAuthType'
        credentials:
          type: object
          additionalProperties:
            type: string
          description: 'Credentials dictionary with required fields for the authentication type.

            Sensitive fields will be encrypted and stored securely.


            For Azure credentials (AzureServicePrincipal, AzureServicePrincipalCertificate):

            - tenantId is automatically populated from the parent tenant''s ProviderTenantId and should not be provided

            - Required fields: clientId, clientSecret (or clientCertificate for certificate auth)'
      additionalProperties: false
      description: Request model for updating a cloud credential.
    ResourceImportMode:
      enum:
      - reconcile
      - additive
      type: string
      description: Defines how a resource import treats managed resources omitted from the import request.
    VerificationStepResponse:
      required:
      - durationMs
      - isSuccess
      - status
      - stepName
      type: object
      properties:
        stepName:
          type: string
          description: Name or description of the verification step.
          example: Authenticating with Azure AD
        status:
          $ref: '#/components/schemas/VerificationStepStatus'
        detail:
          type:
          - string
          - 'null'
          description: Optional warning or error detail (null for most successes).
        isSuccess:
          type: boolean
          description: Whether this verification step succeeded.
          readOnly: true
          example: true
        durationMs:
          type: integer
          description: Duration of this step in milliseconds.
          format: int64
          example: 450
      additionalProperties: false
      description: 'Response DTO representing a single verification step result.

        Each step contains information about a specific check performed during credential verification.'
    DiscoveredHostPoolDtoPagedResultDto:
      required:
      - count
      - hasMore
      - items
      - page
      - pageSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredHostPoolDto'
          description: The items in the current page.
        page:
          type: integer
          description: Current page number (1-based).
          format: int32
        pageSize:
          type: integer
          description: Number of items per page.
          format: int32
        count:
          type: integer
          description: 'Actual number of items returned in this page.

            May be less than PageSize on the last page.'
          format: int32
        hasMore:
          type: boolean
          description: 'Indicates if more pages are available.

            True if Count equals PageSize, suggesting more data exists.'
        totalCount:
          type:
          - integer
          - 'null'
          description: 'Total count of items across all pages (if available).

            May be null if the data source does not support total count queries.'
          format: int32
      additionalProperties: false
      description: 'Generic paginated response wrapper for API endpoints.

        Supports traditional page-based navigation with forward/backward capability.'
    TenantHealthStatus:
      enum:
      - unknown
      - healthy
      - warning
      - error
      type: string
      description: 'Aggregated health status for a cloud tenant.

        Computed from subscription health statuses and credential verification results.'
    TenantDefaultCredentialDto:
      required:
      - authType
      - credentials
      type: object
      properties:
        authType:
          $ref: '#/components/schemas/CloudProviderAuthType'
        credentials:
          type: object
          additionalProperties:
            type: string
          description: 'Credentials dictionary with sensitive values masked.

            Only non-sensitive metadata fields (e.g., ClientId) are shown in clear text.

            Sensitive fields (e.g., ClientSecret) show first 3 characters followed by asterisks.'
      additionalProperties: false
      description: 'Simplified response DTO for a tenant''s default credential (nested within CloudTenantDto).

        Contains only authentication type and masked credentials.

        For full credential details (Id, IsEnabled, timestamps), use GET /tenants/{id}/credentials.'
    DiscoveredManagedCloudResourceDtoPagedResultDto:
      required:
      - count
      - hasMore
      - items
      - page
      - pageSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredManagedCloudResourceDto'
          description: The items in the current page.
        page:
          type: integer
          description: Current page number (1-based).
          format: int32
        pageSize:
          type: integer
          description: Number of items per page.
          format: int32
        count:
          type: integer
          description: 'Actual number of items returned in this page.

            May be less than PageSize on the last page.'
          format: int32
        hasMore:
          type: boolean
          description: 'Indicates if more pages are available.

            True if Count equals PageSize, suggesting more data exists.'
        totalCount:
          type:
          - integer
          - 'null'
          description: 'Total count of items across all pages (if available).

            May be null if the data source does not support total count queries.'
          format: int32
      additionalProperties: false
      description: 'Generic paginated response wrapper for API endpoints.

        Supports traditional page-based navigation with forward/backward capability.'
    SubscriptionHealthStatus:
      enum:
      - unknown
      - healthy
      - warning
      - error
      - inProgress
      type: string
      description: 'Operational health status of an active cloud subscription.

        Only meaningful when SubscriptionLifecycleState = Active.

        Derived from last verification and inventory sync results.'
    ImageSourceType:
      enum:
      - managed
      - sharedImageGallery
      type: string
      description: Represents the source type of a virtual machine image.
    CloudTenantStatusDto:
      required:
      - status
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TenantHealthStatus'
        statusMessage:
          type:
          - string
          - 'null'
          description: 'Human-readable message describing the current status.

            Examples: "All checks passed", "2 subscriptions have credential errors", "Secret expires in 5 days".'
        lastVerifiedAt:
          type:
          - string
          - 'null'
          description: 'Timestamp when the tenant''s credentials were last verified.

            Updated by the credentials verification background job.'
          format: date-time
        subscriptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TenantSubscriptionStatusDto'
          description: Detailed status information for each subscription under this tenant.
        credentials:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CredentialStatusDto'
          description: Pool status (health, cooldown, usage) for each credential under this tenant.
      additionalProperties: false
      description: 'Status information for a cloud tenant.

        Used when querying tenant status directly (e.g., GET /tenants/{id}/status).

        Provides aggregated health status computed from credentials and subscription statuses.'
    DiscoveredSubscriptionDto:
      required:
      - id
      - isAlreadyManaged
      - name
      - properties
      - state
      - tags
      - tenantId
      - type
      type: object
      properties:
        id:
          type: string
          description: The cloud provider's subscription ID (e.g., Azure subscription GUID).
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          description: The display name of the subscription.
          example: Production Subscription
        type:
          $ref: '#/components/schemas/DiscoverableResourceType'
        state:
          type: string
          description: The subscription state (e.g., Enabled, Disabled, Warned).
          example: Enabled
        tenantId:
          type: string
          description: The cloud provider's tenant ID (e.g., Azure AD tenant GUID).
          example: 11111111-2222-3333-4444-555555555555
        tags:
          type: object
          additionalProperties:
            type: string
          description: Tags associated with the subscription.
        properties:
          type: object
          additionalProperties:
            type: string
          description: Additional subscription properties (quotaId, spendingLimit, authorizationSource, etc.).
        isAlreadyManaged:
          type: boolean
          description: Whether this subscription is already imported into the application
          example: false
      additionalProperties: false
      description: Represents a subscription discovered from a cloud tenant.
    PatchCloudCredentialRequest:
      type: object
      properties:
        authType:
          $ref: '#/components/schemas/CloudProviderAuthType'
        credentials:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: 'Credentials dictionary. Can provide partial credentials (e.g., just clientSecret)

            to update specific fields. Sensitive fields will be encrypted and stored securely.


            For Azure credentials: tenantId is automatically derived from the parent tenant

            and should not be provided.'
      additionalProperties: false
      description: 'Request model for patching (partial update) a cloud credential.

        All fields are optional - only provided fields will be updated.'
    JobCreatedDto:
      required:
      - action
      - id
      - jobType
      - jobUrl
      - logsUrl
      - message
      - statusUrl
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the created job.
          format: uuid
        jobType:
          $ref: '#/components/schemas/JobType'
        action:
          type: string
          description: 'Job action identifier.

            For standard jobs, this matches the JobType formatted with spaces (e.g., "Cloud Resource Import").

            For action jobs, this is the specific action name formatted with spaces (e.g., "Start", "Stop").'
        jobUrl:
          type: string
          description: URL to get full job details (includes parameters).
        statusUrl:
          type: string
          description: 'URL to poll for lightweight status updates (no parameters).

            Poll this endpoint every 2-5 seconds while job is running.'
        logsUrl:
          type: string
          description: URL to get job logs in JSON format.
        message:
          type: string
          description: 'Human-readable message about job creation.

            Example: "Import job created successfully. Poll statusUrl for progress updates."'
      additionalProperties: false
      description: 'Lightweight response returned when a job is created.

        Contains only essential information needed to track the job.

        Use the statusUrl to poll for updates and jobUrl to get full details.'
    DiscoveredImageDto:
      required:
      - id
      - imageSourceType
      - isAlreadyManaged
      - location
      - name
      - osType
      - resourceGroup
      - subscriptionId
      - tags
      - type
      type: object
      properties:
        id:
          type: string
          description: 'Cloud provider resource identifier.

            For Azure, this is the fully qualified resource ID.'
        subscriptionId:
          type: string
          description: Cloud provider subscription ID containing this entity.
        name:
          type: string
          description: User-friendly entity name.
        type:
          $ref: '#/components/schemas/DiscoverableResourceType'
        location:
          type: string
          description: Geographic location or region where the entity is deployed.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Gets a collection of tags associated with the entity.
        resourceGroup:
          type: string
          description: Resource group name containing this resource.
        isAlreadyManaged:
          type: boolean
          description: Whether this resource is already managed by the application
          example: false
        galleryId:
          type:
          - string
          - 'null'
          description: Parent gallery ARM resource ID. Null for managed images.
        galleryName:
          type:
          - string
          - 'null'
          description: Parent gallery name. Null for managed images.
        imageSourceType:
          $ref: '#/components/schemas/ImageSourceType'
        hyperVGeneration:
          type:
          - string
          - 'null'
          description: Hyper-V generation of the image (V1 or V2). Null for managed images.
        diskControllerTypes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Disk controller types supported by the image definition, when available.
        cpuArchitectureType:
          type:
          - string
          - 'null'
          description: CPU architecture type of the image (e.g., "x64", "Arm64"). Null when Azure omits the architecture property.
        osType:
          type: string
          description: Operating system type (Windows or Linux).
        osState:
          type:
          - string
          - 'null'
          description: OS state of the image (Generalized or Specialized).
        sku:
          type:
          - string
          - 'null'
          description: Image SKU if from Shared Image Gallery.
        offer:
          type:
          - string
          - 'null'
          description: Image offer if from Shared Image Gallery.
        publisher:
          type:
          - string
          - 'null'
          description: Image publisher if from Shared Image Gallery.
        version:
          type:
          - string
          - 'null'
          description: Image version if from Shared Image Gallery.
        securityType:
          $ref: '#/components/schemas/VmSecurityType'
        recommendedMemoryMinBytes:
          type:
          - integer
          - 'null'
          description: Recommended minimum memory size in bytes for the image.
          format: int64
        recommendedMemoryMaxBytes:
          type:
          - integer
          - 'null'
          description: Recommended maximum memory size in bytes for the image.
          format: int64
        recommendedCoresMin:
          type:
          - integer
          - 'null'
          description: Recommended minimum core count for the image.
          format: int32
        recommendedCoresMax:
          type:
          - integer
          - 'null'
          description: Recommended maximum core count for the image.
          format: int32
      additionalProperties: false
      description: 'Represents a discovered virtual machine image.

        Extends the base CloudResourceDto with image-specific properties.'
    CreateCloudCredentialRequest:
      required:
      - authType
      - credentials
      type: object
      properties:
        authType:
          $ref: '#/components/schemas/CloudProviderAuthType'
        credentials:
          type: object
          additionalProperties:
            type: string
          description: 'Credentials dictionary with required fields for the authentication type.

            Sensitive fields will be encrypted and stored securely.


            For Azure credentials (AzureServicePrincipal, AzureServicePrincipalCertificate):

            - tenantId is automatically populated from the parent tenant''s ProviderTenantId and should not be provided

            - Required fields: clientId, clientSecret (or clientCertificate for certificate auth)'
      additionalProperties: false
      description: Request model for creating a new cloud credential.
    HostPoolType:
      enum:
      - pooled
      - personal
      type: string
      description: Represents the type of Azure Virtual Desktop host pool.
    CredentialStatusDto:
      required:
      - authFailureCount
      - failedUsages
      - failureRatePercent
      - id
      - rateLimitCount
      - status
      - successfulUsages
      - successRatePercent
      - totalUsages
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the credential.
          format: uuid
        status:
          $ref: '#/components/schemas/CredentialStatus'
        statusMessage:
          type:
          - string
          - 'null'
          description: Human-readable message describing the current status.
        cooldownRemainingSeconds:
          type:
          - number
          - 'null'
          description: 'Remaining cooldown time in seconds, if the credential is rate limited.

            Null if not in cooldown.'
          format: double
        lastUsedAt:
          type:
          - string
          - 'null'
          description: 'When the credential was last used for an operation.

            Null if never used or data has expired.'
          format: date-time
        totalUsages:
          type: integer
          description: Total number of usages (business operations) with this credential in the tracking window.
          format: int32
        successfulUsages:
          type: integer
          description: Number of successful usages.
          format: int32
        failedUsages:
          type: integer
          description: Number of failed usages.
          format: int32
        successRatePercent:
          type: number
          description: Success rate as a percentage (0-100).
          format: double
        failureRatePercent:
          type: number
          description: Failure rate as a percentage (0-100).
          format: double
        rateLimitCount:
          type: integer
          description: Number of times this credential received a 429 (Too Many Requests) response.
          format: int32
        authFailureCount:
          type: integer
          description: Number of times this credential received 401/403 auth errors.
          format: int32
        lastErrorCode:
          type:
          - string
          - 'null'
          description: Last error code received (e.g., "429", "401", "500").
      additionalProperties: false
      description: 'Response DTO representing the pool status of a credential.

        Includes health status, cooldown state, and usage metrics from Redis.'
    CloudTenantDto:
      required:
      - createdAt
      - defaultCredential
      - healthStatus
      - id
      - lastUpdated
      - lifecycleState
      - name
      - provider
      - providerTenantId
      - subscriptionCount
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the tenant.
          format: uuid
        provider:
          $ref: '#/components/schemas/CloudProvider'
        providerTenantId:
          type: string
          description: 'Provider''s tenant identifier.

            Azure: Tenant ID (Directory ID), AWS: Organization ID, GCP: Organization ID.'
        name:
          type: string
          description: User-friendly name for the tenant.
        defaultCredential:
          $ref: '#/components/schemas/TenantDefaultCredentialDto'
        lifecycleState:
          $ref: '#/components/schemas/TenantLifecycleState'
        healthStatus:
          $ref: '#/components/schemas/TenantHealthStatus'
        healthStatusMessage:
          type:
          - string
          - 'null'
          description: 'Human-readable message describing the current tenant health status.

            Examples: "All checks passed", "2 subscriptions have credential errors", "Secret expires in 5 days".'
        subscriptionCount:
          type: integer
          description: 'Number of active subscriptions under this tenant.

            Excludes deleted subscriptions.'
          format: int32
        lastDiscoveryAt:
          type:
          - string
          - 'null'
          description: Timestamp of the last subscription discovery.
          format: date-time
        createdAt:
          type: string
          description: Timestamp when the tenant was created.
          format: date-time
        lastUpdated:
          type: string
          description: Timestamp of the last update.
          format: date-time
      additionalProperties: false
      description: Response DTO representing a cloud tenant (Azure AD Tenant, AWS Organization, GCP Organization).
    DiscoveredManagedCloudResourceDto:
      required:
      - id
      - isAlreadyManaged
      - location
      - name
      - properties
      - resourceGroup
      - subscriptionId
      - tags
      - type
      type: object
      properties:
        id:
          type: string
          description: 'Cloud provider resource identifier.

            For Azure, this is the fully qualified resource ID.'
        subscriptionId:
          type: string
          description: Cloud provider subscription ID containing this entity.
        name:
          type: string
          description: User-friendly entity name.
        type:
          $ref: '#/components/schemas/DiscoverableResourceType'
        location:
          type: string
          description: Geographic location or region where the entity is deployed.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Gets a collection of tags associated with the entity.
        properties:
          type: object
          additionalProperties:
            type: string
          description: Gets a collection of additional entity properties.
        resourceGroup:
          type: string
          description: Resource group name containing this resource.
        isAlreadyManaged:
          type: boolean
          description: Whether this resource is already managed by the application
          example: false
      additionalProperties: false
      description: 'Represents a discovered cloud resource with managed status.

        Used by the generic multi-type discover endpoint where resources may be already imported.'
    TenantSubscriptionImportDto:
      required:
      - providerSubscriptionId
      - resources
      type: object
      properties:
        providerSubscriptionId:
          minLength: 1
          type: string
          description: 'The cloud provider''s subscription identifier (e.g., Azure Subscription GUID).

            If a CloudSubscription with this ID doesn''t exist, one will be created and linked to the tenant.'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/CloudResourceIdsByTypeDto'
          description: 'Resources to import from this subscription, organized by type.

            Each item specifies a resource type and the Azure resource IDs to import.'
      additionalProperties: false
      description: Represents a subscription and its resources to import.
    CreateCloudTenantRequest:
      required:
      - defaultCredential
      - name
      - provider
      - providerTenantId
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/CloudProvider'
        providerTenantId:
          maxLength: 256
          minLength: 1
          type: string
          description: 'Provider''s tenant identifier.

            Azure: Tenant ID (Directory ID), AWS: Organization ID, GCP: Organization ID.'
        name:
          maxLength: 128
          minLength: 1
          type: string
          description: User-friendly name for the tenant.
        defaultCredential:
          $ref: '#/components/schemas/CreateCloudCredentialRequest'
      additionalProperties: false
      description: 'Request model for creating a new cloud tenant with its default credential.

        The default credential is created as a separate entity linked to the tenant.'
    CloudCredentialDto:
      required:
      - authType
      - createdAt
      - credentials
      - id
      - isDefault
      - lastUpdated
      - status
      - tenantId
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the credential.
          format: uuid
        tenantId:
          type: string
          description: ID of the parent tenant.
          format: uuid
        authType:
          $ref: '#/components/schemas/CloudProviderAuthType'
        credentials:
          type: object
          additionalProperties:
            type: string
          description: 'Credentials dictionary with sensitive values masked.

            Only non-sensitive metadata fields (e.g., ClientId) are shown in clear text.'
        isDefault:
          type: boolean
          description: 'Whether this credential is the default credential for the tenant.

            The default credential is used when no specific credential is specified.'
        status:
          $ref: '#/components/schemas/CredentialStatus'
        statusMessage:
          type:
          - string
          - 'null'
          description: 'Human-readable message describing the credential status.

            Provides context for non-healthy statuses (e.g., "Failed subscription access verification").'
        lastUsedAt:
          type:
          - string
          - 'null'
          description: 'Timestamp when this credential was last used for API calls.

            Used for round-robin (LRU) selection.'
          format: date-time
        createdAt:
          type: string
          description: Timestamp when the credential was created.
          format: date-time
        lastUpdated:
          type: string
          description: Timestamp of the last update.
          format: date-time
      additionalProperties: false
      description: Response DTO representing a cloud credential (Service Principal, IAM User/Role, etc.).
    VerificationStepStatus:
      enum:
      - success
      - warning
      - failure
      type: string
      description: Discrete states a verification step can finish in.
    CloudResourceIdsByTypeDto:
      required:
      - ids
      - type
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DiscoverableResourceType'
        ids:
          uniqueItems: true
          type: array
          items:
            type: string
          description: Set of specific resource IDs to import for this resource type.
      additionalProperties: false
      description: Represents a collection of resource IDs for a specific resource type.
    CredentialStatus:
      enum:
      - unknown
      - healthy
      - rateLimited
      - unhealthy
      - disabled
      type: string
      description: 'Status of an individual credential.

        Used for rate limiting, health tracking, and administrative state.'
  securitySchemes:
    BearerAuth:
      type: http
      description: '**API Key Authentication** (Recommended)


        [Learn how to create an API key](https://api.controlup.io/reference/how-to-create-api-keys).'
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      description: '**Cookie Authentication** (Browser use)


        ⚠️ The ''Authorize'' button cannot set cookies due to browser security.


        To authenticate in browser:

        1. Login via DEX authentication service (same browser session)

        2. Or use DevTools Console: `document.cookie = "user_dex_token=YOUR_TOKEN; path=/"`'
      name: user_dex_token
      in: cookie
