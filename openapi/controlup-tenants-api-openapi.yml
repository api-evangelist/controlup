        in: query
        description: Comma-separated list of resource types to discover (e.g., "HostPool", "HostPool,Image").
        required: true
        schema:
          type: string
      - name: subscriptionIds
        in: query
        description: 'Optional comma-separated list of Azure subscription IDs (GUIDs) to query.

