components:
  schemas:
    VerificationStepStatus:
      enum:
      - success
      - warning
      - failure
      type: string
      description: Discrete states a verification step can finish in.
    LookedUpGalleryDtoPagedResultDto:
      required:
      - count
      - hasMore
      - items
      - page
      - pageSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LookedUpGalleryDto'
          description: The items in the current page.
        page:
          type: integer
          description: Current page number (1-based).
          format: int32
        pageSize:
          type: integer
          description: Number of items per page.
          format: int32
        count:
          type: integer
          description: 'Actual number of items returned in this page.

            May be less than PageSize on the last page.'
          format: int32
        hasMore:
          type: boolean
          description: 'Indicates if more pages are available.

            True if Count equals PageSize, suggesting more data exists.'
        totalCount:
          type:
          - integer
          - 'null'
          description: 'Total count of items across all pages (if available).

            May be null if the data source does not support total count queries.'
          format: int32
      additionalProperties: false
      description: 'Generic paginated response wrapper for API endpoints.

        Supports traditional page-based navigation with forward/backward capability.'
    ComputeQuotaDtoPagedResultDto:
      required:
      - count
      - hasMore
      - items
      - page
      - pageSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComputeQuotaDto'
          description: The items in the current page.
        page:
          type: integer
          description: Current page number (1-based).
          format: int32
        pageSize:
          type: integer
          description: Number of items per page.
          format: int32
        count:
          type: integer
          description: 'Actual number of items returned in this page.

            May be less than PageSize on the last page.'
          format: int32
        hasMore:
          type: boolean
          description: 'Indicates if more pages are available.

            True if Count equals PageSize, suggesting more data exists.'
        totalCount:
          type:
          - integer
          - 'null'
          description: 'Total count of items across all pages (if available).

            May be null if the data source does not support total count queries.'
          format: int32
      additionalProperties: false
      description: 'Generic paginated response wrapper for API endpoints.

        Supports traditional page-based navigation with forward/backward capability.'
    VmSizeDto:
      required:
      - cores
      - displayName
      - isRestricted
      - localStorageBytes
      - maxDataDisks
      - memoryBytes
      - name
      - osDiskSizeBytes
      - size
      - supportsAcceleratedNetworking
      - supportsDiskControllerNVMe
      - supportsDiskControllerSCSI
      - supportsEphemeralOSDisk
      - supportsHyperVGenerationV1
      - supportsHyperVGenerationV2
      - supportsPremiumStorage
      - supportsTrustedLaunch
      type: object
      properties:
        name:
          type: string
          description: VM size name (e.g., "Standard_D2s_v3", "Standard_B2ms").
        displayName:
          type: string
          description: 'Display name combining tier and size (e.g., "Standard D2s_v3", "Basic A1").

            User-friendly formatted name for UI presentation.'
        tier:
          type:
          - string
          - 'null'
          description: VM size tier (e.g., "Basic", "Standard").
        size:
          type: string
          description: 'Size identifier without the tier prefix (e.g., "D2s_v3", "B2ms").

            Useful for grouping VM sizes by family/series.'
        cores:
          type: integer
          description: Number of virtual CPU cores.
          format: int32
        memoryBytes:
          type: integer
