  /cloud/subscriptions/{subscriptionId}/preflight/permissions/host-pool-create:
    get:
      tags:
      - Subscriptions
      summary: Check host pool create permissions
      description: "Advisory check that the subscription's service principal can create AVD control-plane\nresources: host pool, application group, and workspace update. Covers the control-plane\nportion of the Create Host Pool wizard (POST host-pool-deployments); when initial session\nhosts will also be created, additionally call the session host create pre-flight.\n            \nEach required permission is evaluated at exactly the scope the create flow exercises it\nagainst (inherited grants from resource group, subscription, or management group count).\n            \nAdvisory only — a failed check never blocks creation. The result carries one of three statuses:\n- granted: all required actions confirmed at their target scopes.\n- missingPermissions: at least one action could not be confirmed; display the returned message as a warning.\n- unknown: the check itself could not run (transient error); do not show a warning."
      operationId: CheckHostPoolCreatePermissions
      parameters:
      - name: subscriptionId
        in: path
        description: The subscription ID.
        required: true
        schema:
          type: string
          format: uuid
      - name: workspaceResourceId
        in: query
        description: 'ARM resource ID of the workspace that will be linked to the application group.

          Workspace permissions are evaluated at this exact scope (inherited grants included).

          Must belong to the selected subscription.'
        required: true
        schema:
          type: string
      - name: resourceGroupName
        in: query
        description: 'Existing Azure resource group the operation deploys into: the control-plane resource

          group for host pool creation, the VM deployment resource group for session host creation.'
        required: true
        schema:
          maxLength: 90
          minLength: 1
          pattern: ^[-\w.()]{0,89}[-\w()]$
          type: string
      responses:
        '200':
          description: Pre-flight check completed (any status, including missingPermissions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPreflightResultDto'
              example:
                status: missingPermissions
                missingPermissions:
                - action: Microsoft.DesktopVirtualization/hostPools/write
                  scope: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-avd-prod
                  capability: hostPool
                - action: Microsoft.Network/virtualNetworks/subnets/join/action
                  scope: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-network/providers/Microsoft.Network/virtualNetworks/vnet-prod/subnets/snet-avd
                  capability: network
                message: The service principal for this subscription may not have permission to create resources. Contact your Azure admin.
        '400':
          description: Bad request. Missing or invalid resource group name or resource ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Payment required. No active license for the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. User does not have host pool creation permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found. The specified subscription does not exist.
          content:
