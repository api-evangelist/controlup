        schema:
          maxLength: 100
          type: string
      - name: resourceGroupId
        in: query
        description: Filter by resource group (internal ID).
        schema:
          type: string
          format: uuid
      - name: workspaceId
        in: query
        description: Filter by workspace (internal ID).
        schema:
          type: string
          format: uuid
      - name: applicationGroupId
        in: query
        description: Filter by application group (internal ID).
        schema:
          type: string
          format: uuid
      - name: hostPoolId
        in: query
        description: Filter by host pool (internal ID).
        schema:
          type: string
          format: uuid
      - name: sessionHostId
