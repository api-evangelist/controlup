- id: idempotency
  conforms: false
  evidence: >-
    No idempotency key documented and no Idempotency-Key parameter in any of the twelve definitions. Write
    operations carry no replay protection.
- id: rate-limit-headers
  conforms: false
  evidence: >-
    Numeric limits are documented at https://api.controlup.io/reference/rate-limiting and 429 is the documented
