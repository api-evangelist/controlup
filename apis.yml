apis:
- name: ControlUp ONE Platform API
  description: Organization, identity and governance API for the ControlUp ONE platform — users, invitations, roles and
    permissions, organization settings, SAML SSO configuration and SSO group mappings, IP allowlist entries, organization
    tags, the audit log, and MSP tenant-organization management. Bearer API-key auth scoped to an organization ID path parameter.
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/v1
  tags:
  - digital-employee-experience
  - identity
  - user-management
  - audit-log
  - saml
  - sso
  properties:
  - type: OpenAPI
    url: openapi/controlup-dex-platform-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
  - type: APIReference
    url: https://api.controlup.io/reference
- name: ControlUp Events and Alerts API
  description: Event and alert API for the ControlUp ONE platform — list and retrieve events with field projection and cardinality
    counts over a time range, and read the configured alert definitions for Devices and other product modules. Backed by
    two published OpenAPI definitions (dex-alerts and dex events).
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/events/v1
  tags:
  - events
  - alerts
  - observability
  - monitoring
  properties:
  - type: OpenAPI
    url: openapi/controlup-dex-alerts-openapi.yml
  - type: OpenAPI
    url: openapi/controlup-dex-events-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
- name: ControlUp for Desktops API
  description: Physical endpoint API for ControlUp for Desktops (formerly Edge DX) — devices and device details, alerts,
    scripts and script actions, surveys, OS errors, events, and a data-access layer for querying collected desktop telemetry
    across Windows, macOS and Linux endpoints.
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/edge/api
  tags:
  - endpoint-management
  - device-management
  - scripts
  - surveys
  - observability
  properties:
  - type: OpenAPI
    url: openapi/controlup-desktops-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
- name: ControlUp for Compliance API
  description: Compliance and endpoint-security posture API — list managed devices, retrieve per-device detail including
    the security score and agent status, and enumerate detected vulnerabilities (CVEs), missing OS and application patches,
    failed compliance controls, and security misconfigurations for a device.
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/compliance
  tags:
  - compliance
  - vulnerability-management
  - patch-management
  - endpoint-security
  properties:
  - type: OpenAPI
    url: openapi/controlup-compliance-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
- name: ControlUp VDI and DaaS Historical API
  description: Historical analytics API for virtual desktop and DaaS estates — host metrics and counts per folder, user
    activity, machine statistics and AI-driven sizing recommendations for virtualization and Azure, session statistics,
    individual session details and timelines, application usage statistics, Windows events, process data, NetScaler ADC
    / Load Balancer / Gateway metrics, and a dynamic query API.
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/historical
  tags:
  - vdi
  - daas
  - citrix
  - netscaler
  - session-analytics
  - capacity-planning
  properties:
  - type: OpenAPI
    url: openapi/controlup-vdi-daas-historical-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
- name: ControlUp VDI and DaaS Realtime Metrics API
  description: Real-time metrics API for VDI and DaaS environments, exposing live metric reads for monitored resources alongside
    the historical API. Bearer API-key auth.
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/vdi/realtime
  tags:
  - vdi
  - daas
  - real-time
  - metrics
  - monitoring
  properties:
  - type: OpenAPI
    url: openapi/controlup-vdi-daas-realtime-metrics-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
- name: ControlUp VDI and DaaS Configuration API
  description: Configuration API for the VDI and DaaS product — machine configuration management plus trigger configuration
    (trigger packs and their follow-up actions, including the RESTful-request webhook action). Published as two OpenAPI
    definitions sharing the /vdi/config base path.
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/vdi/config
  tags:
  - vdi
  - daas
  - configuration
  - triggers
  - automation
  properties:
  - type: OpenAPI
    url: openapi/controlup-vdi-daas-configuration-openapi.yml
  - type: OpenAPI
    url: openapi/controlup-vdi-config-triggers-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
- name: ControlUp DaaS IQ API
  description: The largest published ControlUp surface — 128 paths and 149 operations covering DaaS IQ, ControlUp's cost-and-capacity
    intelligence layer for Azure Virtual Desktop, Windows 365 and other DaaS estates. Bearer API-key auth with an alternate
    cookie-based session scheme.
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/daas-iq/v1
  tags:
  - daas
  - azure-virtual-desktop
  - windows-365
  - cost-optimization
  - capacity-planning
  properties:
  - type: OpenAPI
    url: openapi/controlup-daas-iq-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
- name: ControlUp Synthetic Monitoring API
  description: Synthetic monitoring API (the former Scoutbees product) — create and manage EUC Scouts that log into Citrix,
    Horizon, AVD and other virtual desktop stacks on a schedule, and Network Scouts that test HTTP endpoints, DNS and connectivity;
    list Custom Hives and Cloud Hives, read test results, manage alert policies and triggered alerts, list MFA identities,
    and list notification integrations.
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/synthetic-monitoring/v2/
  tags:
  - synthetic-monitoring
  - vdi
  - uptime-monitoring
  - alerting
  - network-monitoring
  properties:
  - type: OpenAPI
    url: openapi/controlup-synthetic-monitoring-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
- name: ControlUp Workflows API
  description: Workflow automation API — list, retrieve, enable/disable and delete flows, list flow runs, manage forms,
    and enumerate integrations together with their available actions, action input/output schemas, and direct action execution
    without running a full flow.
  humanURL: https://api.controlup.io/reference
  baseURL: https://api.controlup.com/workflows/v1
  tags:
  - workflow-automation
  - integrations
  - orchestration
  properties:
  - type: OpenAPI
    url: openapi/controlup-workflows-openapi.yml
  - type: Documentation
    url: https://api.controlup.io/reference
- name: ControlUp MCP Server
  description: Official Model Context Protocol server published by ControlUp as the npm package @controlup-ai/mcp. Runs
    locally over stdio via npx, authenticates with a ControlUp API key plus organization ID, and exposes 106 tools across
    six selectable product domains (platform, cu4d, vdi, cu4c, workflows, synthetic-monitoring) that call the public REST
    API on the customer's behalf.
  humanURL: https://support.controlup.com/docs/mcp-server
  baseURL: https://api.controlup.com
  tags:
  - mcp
  - agent-native
  - digital-employee-experience
  - automation
  properties:
  - type: MCPServer
    url: mcp/controlup-mcp.yml
  - type: ToolCrosswalk
