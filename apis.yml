apis:
- name: ControlUp MCP Server
  description: >-
    Official Model Context Protocol server published by ControlUp as the npm package @controlup-ai/mcp.
    Runs locally over stdio via npx, authenticates with a ControlUp API key plus organization ID, and
    exposes 106 tools across six selectable product domains (platform, cu4d, vdi, cu4c, workflows, synthetic-monitoring)
    that call the public REST API on the customer's behalf.
  humanURL: https://support.controlup.com/docs/mcp-server
  baseURL: https://api.controlup.com
  tags:
  - MCP
  - agent-native
