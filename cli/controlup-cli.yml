type: powershell-module
note: >-
  ControlUp ships no cross-platform command-line binary. Its first-party command surface is a set of PowerShell
  cmdlets for the VDI & DaaS product — the "VDI PowerShell Automation Module" — which talk to the ControlUp Monitor
  cluster and the on-premises/hybrid environment rather than to the public REST API at api.controlup.com. They are
  therefore a genuinely separate control plane from the REST + MCP surfaces, not a wrapper around them.
install:
- method: powershell-gallery
  command: Install-Module -Name ControlUp.Automation
  url: https://www.powershellgallery.com/packages/ControlUp.Automation
  version: 1.0.8
  publisher: ControlUp
- method: bundled
  description: >-
    The VDI PowerShell Automation Module ships with the ControlUp Monitor / Real-Time Console installation and is
    documented per-cmdlet in the knowledge base.
  url: https://support.controlup.com/docs/vdi-powershell-automation-module
docs: https://support.controlup.com/docs/vdi-daas
