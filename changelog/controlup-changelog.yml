structure: >-
  Release notes are organised as one page per calendar month, sectioned by product (Platform, Dashboards, ControlUp
  for Desktops, ControlUp AI, ControlUp DaaS IQ, ControlUp for VDI, Synthetic Monitoring, Workflows, Compliance),
  with a dated heading per change. Agent and console builds carry explicit version numbers; the cloud platform
  itself is not version-numbered. There is no separate API changelog — API changes appear inside the product
  release notes when they surface at all.
