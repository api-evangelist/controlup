notes:
- >-
  ControlUp publishes no dedicated API changelog and no per-definition version history. The twelve OpenAPI
  definitions in openapi/ carry ReadMe upload timestamps rather than semantic versions, and the API reference hub
  does not surface a diff between uploads. An agent tracking breaking changes has to read product release notes and
  re-diff the specs.
